name: ops-exec
on:
  workflow_dispatch:
    inputs:
      cmd_b64: { description: "base64 command to run on the server", required: true }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: { contents: read }
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SSH_PASS: ${{ secrets.HAMID_PASSWORD }}
      TARGET_IP: ${{ secrets.TAILSCALE_FIXED_IP }}
      # برای ویرایش سیاست tailnet (فعال کردن Funnel روی همهٔ گره‌ها).
      # تأیید تک‌گره بی‌فایده است: هر تعویض رانر یک گره تازه می‌سازد.
      TS_API: ${{ secrets.TAILSCALE_API_TOKEN }}
    steps:
      - name: exec on server
        shell: bash
        env:
          CMD_B64: ${{ inputs.cmd_b64 }}
          TS_API: ${{ secrets.TAILSCALE_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SSH_PASS"
          [ -n "${TS_API:-}" ] && echo "::add-mask::$TS_API"
          sudo apt-get update -y >/dev/null 2>&1
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -o DPkg::Lock::Timeout=120 curl jq sshpass openssh-client >/dev/null 2>&1
          if ! sudo tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
            sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --accept-routes --ssh=false >/tmp/tsup.log 2>&1 || { tail -5 /tmp/tsup.log; exit 1; }
          fi
          for i in {1..15}; do sudo tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null 2>&1 && break || sleep 2; done
          SSHOPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/kh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15)
          for i in 1 2 3 4 5; do sshpass -p "$SSH_PASS" ssh "${SSHOPTS[@]}" root@"$TARGET_IP" 'echo SSH_OK' 2>/dev/null | grep -q SSH_OK && break || { echo "wait ssh ($i)"; sleep 5; }; done
          echo "$CMD_B64" | base64 -d > /tmp/remote.sh
          # v6.19: placeholder __HAMID_PASSWORD__ is replaced with the real
          # secret here on the runner, so the public cmd_b64 input and the
          # public logs never contain the password (it is add-mask'ed too).
          SUBS=$(grep -c "__HAMID_PASSWORD__" /tmp/remote.sh || true)
          sed -i "s|__HAMID_PASSWORD__|${SSH_PASS}|g" /tmp/remote.sh
          sed -i "s|__TS_API__|${TS_API:-}|g" /tmp/remote.sh
          echo "[ops-exec] secret placeholder substitutions: ${SUBS}"
          sshpass -p "$SSH_PASS" ssh "${SSHOPTS[@]}" root@"$TARGET_IP" 'bash -s' < /tmp/remote.sh 2>&1 | tail -120
          echo "=== OPS-EXEC DONE ==="
      - name: "cleanup: leave tailnet (no ghost nodes)"
        if: always()
        shell: bash
        run: sudo tailscale logout >/dev/null 2>&1 || true
