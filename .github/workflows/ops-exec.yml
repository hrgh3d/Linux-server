name: ops-exec
on:
  workflow_dispatch:
    inputs:
      cmd_b64: { description: "base64 command to run on the server", required: true }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions: { contents: read }
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      SSH_PASS: ${{ secrets.HAMID_PASSWORD }}
      TARGET_IP: ${{ secrets.TAILSCALE_FIXED_IP }}
    steps:
      - name: exec on server
        shell: bash
        env:
          CMD_B64: ${{ inputs.cmd_b64 }}
        run: |
          set -uo pipefail
          echo "::add-mask::$SSH_PASS"
          sudo apt-get update -y >/dev/null 2>&1
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -o DPkg::Lock::Timeout=120 curl jq sshpass openssh-client >/dev/null 2>&1
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname=ops-exec-$$ --accept-routes --ssh=false >/tmp/tsup.log 2>&1 || { tail -5 /tmp/tsup.log; exit 1; }
          for i in {1..15}; do sudo tailscale status --json 2>/dev/null | jq -e '.Self.Online == true' >/dev/null 2>&1 && break || sleep 2; done
          SSHOPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/kh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=15)
          for i in 1 2 3 4 5; do sshpass -p "$SSH_PASS" ssh "${SSHOPTS[@]}" root@"$TARGET_IP" 'echo SSH_OK' 2>/dev/null | grep -q SSH_OK && break || { echo "wait ssh ($i)"; sleep 5; }; done
          echo "$CMD_B64" | base64 -d > /tmp/remote.sh
          sshpass -p "$SSH_PASS" ssh "${SSHOPTS[@]}" root@"$TARGET_IP" 'bash -s' < /tmp/remote.sh 2>&1 | tail -120
          echo "=== OPS-EXEC DONE ==="
