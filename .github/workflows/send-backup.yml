name: send-backup

# v6.50 — یک اسنپ‌شات **کامل** هر شب به تلگرام.
#
# قبلاً دو زمان‌بندی بود: روزانهٔ سبک (بدون اسنپ‌شات state) و هفتگیِ DR.
# یعنی اگر سیستم روز چهارشنبه از دست می‌رفت، تازه‌ترین باندلِ کاملْ مال
# شنبه بود. خواستهٔ کاربر صریح است: هر شب یک اسنپ‌شات کامل که با آن
# بشود کل سیستم را روی حساب گیت‌هاب تازه سرپا کرد. پس DR همیشه روشن است.
on:
  schedule:
    - cron: '47 3 * * *'      # هر شب ۰۳:۴۷ UTC — اسنپ‌شات کامل DR
  workflow_dispatch:
    inputs:
      full:
        description: 'بکاپ DR کامل: اسنپ‌شات state را هم بفرست'
        required: false
        default: 'false'
      force:
        description: 'dedup را نادیده بگیر و حتی اگر باندل تازه ارسال شده دوباره بفرست'
        required: false
        default: 'false'
  repository_dispatch:
    types: [send-backup]

permissions:
  contents: write   # v6.17: نوشتن marker باندل (.bundle-state.json)

concurrency:
  group: send-backup
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  STATE_REPO: ${{ github.repository }}-state
  VPS_NAME: hrgh3d
  TARGET_IP: '100.70.83.2'
  TELEGRAM_BOT_TOKEN: ${{ secrets.REPORT_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
  NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
  # همیشه DR: هر اجرا باید یک باندل کاملِ خودکفا بدهد.
  DR_MODE: 'true'
  FORCE: ${{ github.event.inputs.force || 'false' }}
  TRIGGER: ${{ github.event.schedule && 'cron' || github.event_name }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPORT_BOT_TOKEN: ${{ secrets.REPORT_BOT_TOKEN || '' }}

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: "backup: server data + recovery bootstrap (+ state snapshot in DR mode)"
        shell: bash
        env:
          # v6.51: report.sh روی رانر این دو را لازم دارد؛ بدونشان
          # «no report-bot destination» می‌دهد و باندل ساخته می‌شود ولی
          # هرگز ارسال نمی‌شود — دقیقاً چیزی که در اجرای ۱۹:۰۸ دیده شد.
          REPORT_BOT_TOKEN: ${{ secrets.REPORT_BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          HAMID_PASSWORD: ${{ secrets.HAMID_PASSWORD }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
          TAILSCALE_FIXED_IP: ${{ secrets.TAILSCALE_FIXED_IP }}
          PERSIST_TOKEN: ${{ secrets.PERSIST_TOKEN }}
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
          SUCCESSOR_TOKEN: ${{ secrets.SUCCESSOR_TOKEN }}
        run: |
          set -uo pipefail
          for v in "${HAMID_PASSWORD:-}" "${PERSIST_TOKEN:-}" "${STATE_TOKEN:-}" "${SUCCESSOR_TOKEN:-}" "${TAILSCALE_AUTH_KEY:-}" "${TAILSCALE_API_TOKEN:-}" "${TAILSCALE_FIXED_IP:-}" "${TELEGRAM_BOT_TOKEN:-}" "${NOTIFY_CHAT_ID:-}" "${DASHBOARD_PASSWORD:-}"; do
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          bash .github/scripts/send_backup.sh
