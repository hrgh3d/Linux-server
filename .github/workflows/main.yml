name: Linux-server — Persistent Ubuntu (Tailscale + Releases) [v5]

# ============================================================================
# سرور Ubuntu پایدار روی GitHub Actions — معماری v5
#
#  Backup فقط «داده/تنظیمات کاربر» است (نه فایل‌های نصب پکیج‌ها):
#    - payload.py ریشه‌های داده/کانفیگ (persist.list) را اسکن می‌کند و
#      کد/کش/ابزارهای نصب را حذف می‌کند → هر فایل جدیدِ پکیج (هر مسیر/نامی)
#      خودکار ذخیره می‌شود.
#    - installed.json کاتالوگ پکیج‌های apt/npm/pip کاربر است؛ در Restore
#      پکیج‌ها ابتدا با دستور نصب خودشان بازنصب و سپس کانفیگ/دیتا روی آن‌ها
#      اعمال می‌شود. اپ‌های سفارشی (9router/Hermes/3x-ui) هم installer خودشان
#      را دارند (provision.sh).
#  Root-first: تمام مراحل با shell ریشه اجرا و ورود SSH مستقیم root انجام می‌شود.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      lifetime_min:
        description: 'طول عمر سرور به دقیقه. برای تست خیلی کم بگذارید (مثلا 5)؛ پیش‌فرض نهایی 350 ≈ 5.8h (سقف 355)'
        required: false
        default: '350'
        type: string
      probe:
        description: 'نوشتن فایل تست در مسیرهای گوناگون + نصب پکیج apt تستی (راستی‌آزمایی مسیر/نام-آگنوستیک و کاتالوگ)'
        required: false
        default: 'false'
        type: string
      selftest:
        description: 'تست محلی SSH (ورود root با کلید، sudo بدون رمز)'
        required: false
        default: 'true'
        type: string
      provision:
        description: 'نصب خودکار اپ‌ها در صورت نبود: 9router / Hermes / 3x-ui'
        required: false
        default: 'true'
        type: string
  schedule:
    - cron: '0 */5 * * *'        # هر ۵ ساعت (UTC)
  repository_dispatch:

concurrency:
  group: linux-server-persistent
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # حداکثر مجاز GitHub ≈ ۶ ساعت

    # همه‌ی steps با shell ریشه اجرا می‌شوند (root-first؛ بدون نیاز به sudo su)
    # NOTE: GitHub executes custom shell templates WITHOUT a shell, so no
    # "$PATH" expansion happens here (that broke with literal PATH=$PATH).
    # sudo -E already preserves the runner's PATH/env; we only pin HOME=/root.
    defaults:
      run:
        shell: sudo -E env HOME=/root bash -e {0}

    permissions:
      contents: read

    env:
      STATE_TAG: state
      PERSIST_REPO: hrgh3d/Linux-server-state
      PERSIST_TOKEN: ${{ secrets.PERSIST_TOKEN }}
      TS_HOSTNAME: linux-server-vps
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN || 'NOT_SET' }}
      TAILSCALE_FIXED_IP: ${{ secrets.TAILSCALE_FIXED_IP || '' }}
      HAMID_PASSWORD: ${{ secrets.HAMID_PASSWORD }}
      SAVE_INTERVAL_MIN: '5'      # همگام‌سازی دوره‌ای (فقط در صورت تغییر)
      LIFETIME_MIN: ${{ inputs.lifetime_min || '350' }}
      PROBE_ENABLED: ${{ inputs.probe || 'false' }}
      SS_SELFTEST: ${{ inputs.selftest || 'true' }}
      PROVISION_ENABLED: ${{ inputs.provision || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Init boot context
        run: |
          BOOT_TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "BOOT_TS=${BOOT_TS}" >> "$GITHUB_ENV"
          echo "Boot started: ${BOOT_TS} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT:-1})"
          mkdir -p /root /home/Hamid
          echo "boot_ts=${BOOT_TS} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT:-1} event=${GITHUB_EVENT_NAME}" >> /root/server.log
          echo "Running as: $(id -un) (uid $(id -u)) — root-first mode"
          echo "BOOT_ID=${BOOT_TS}" >> "$GITHUB_ENV"

      - name: Setup base system + image baselines
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 \
            openssh-server sudo curl wget git tar rsync jq python3 ca-certificates nodejs npm \
            || DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 \
            openssh-server sudo curl wget git tar rsync jq python3 ca-certificates
          # baseline های image برای محاسبه‌ی «آنچه کاربر اضافه کرده» در save
          timeout 60 apt-mark showmanual | sort > /tmp/base_manual_packages.list || true
          npm ls -g --depth=0 --json 2>/dev/null | jq -r '.dependencies | keys[]' | sort > /tmp/base_npm.list || true
          pip3 list --format=freeze 2>/dev/null | cut -d= -f1 | sort > /tmp/base_pip.list || true
          ls -A1 /opt 2>/dev/null > /tmp/base_opt_entries.list || true
          ls -A1 /usr/local/bin 2>/dev/null > /tmp/base_usrlocalbin.list || true
          ls -A1 /usr/local/sbin 2>/dev/null > /tmp/base_usrlocalsbin.list || true
          ls -A1 /var/lib 2>/dev/null > /tmp/base_varlib_entries.list || true
          echo "baselines: apt=$(wc -l < /tmp/base_manual_packages.list 2>/dev/null || echo 0) npm=$(wc -l < /tmp/base_npm.list 2>/dev/null || echo 0) pip=$(wc -l < /tmp/base_pip.list 2>/dev/null || echo 0) opt=$(wc -l < /tmp/base_opt_entries.list 2>/dev/null || echo 0) varlib=$(wc -l < /tmp/base_varlib_entries.list 2>/dev/null || echo 0)"
          echo "Base system ready"

      - name: Create root/Hamid accounts (root-first)
        run: |
          # root: بدون پسورد، ورود فقط با کلید
          passwd -d root || true
          # کاربر Hamid (اختیاری) با sudo بدون رمز
          if ! id Hamid &>/dev/null; then useradd -m -s /bin/bash Hamid; fi
          usermod -aG sudo Hamid
          if [ -n "${HAMID_PASSWORD:-}" ]; then echo "Hamid:${HAMID_PASSWORD}" | chpasswd; fi
          echo 'Hamid ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/hamid
          chmod 0440 /etc/sudoers.d/hamid
          mkdir -p /home/Hamid && chown -R Hamid:Hamid /home/Hamid
          echo "root passwordless; Hamid NOPASSWD sudo; job runs as root"

      - name: Restore — prep (download state + reinstall catalog packages)
        run: bash .github/scripts/restore.sh prep

      - name: Provision persistent apps (9router / Hermes / 3x-ui if missing)
        if: env.PROVISION_ENABLED == 'true'
        run: bash .github/scripts/provision.sh

      - name: Restore — apply (config/data payload over reinstalled packages)
        run: bash .github/scripts/restore.sh apply

      - name: Write persistence probe (new paths + second apt pkg)
        if: env.PROBE_ENABLED == 'true'
        run: |
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "== run=${GITHUB_RUN_ID} boot=${BOOT_TS} =="
          # (a) /root — مسیر آشنا
          mkdir -p /root/persistence-probe
          [ -f /root/persistence-probe/root.txt ] && echo "RESTORED /root/persistence-probe/root.txt" || echo "PROBE root.txt $TS" > /root/persistence-probe/root.txt
          cat /root/persistence-probe/root.txt 2>/dev/null
          # (b) مسیر و نام کاملاً جدید در /var/lib (Path/Name-agnostic)
          mkdir -p /var/lib/persistence-probe-z9x
          [ -f /var/lib/persistence-probe-z9x/state.data ] && echo "RESTORED /var/lib/...z9x/state.data" || echo "PROBE state.data $TS" > /var/lib/persistence-probe-z9x/state.data
          cat /var/lib/persistence-probe-z9x/state.data 2>/dev/null
          # (c) فایل کانفیگ با نام جدید در /etc
          [ -f /etc/persistence-probe.conf ] && echo "RESTORED /etc/persistence-probe.conf" || echo "PROBE etc $TS" > /etc/persistence-probe.conf
          cat /etc/persistence-probe.conf 2>/dev/null
          # (d) پکیج apt تستی دوم (کاتالوگ apt)
          if command -v cowsay >/dev/null 2>&1; then
            echo "cowsay ALREADY INSTALLED ($(dpkg-query -W -f='${Version}' cowsay 2>/dev/null))"
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 cowsay >/dev/null 2>&1 && echo "cowsay INSTALLED fresh" || echo "WARN cowsay"
          fi

      - name: Configure SSH (fixed key + host keys) — root login
        run: bash .github/scripts/ssh_configure.sh

      - name: SSH local self-test (root key login, passwordless sudo/su)
        if: env.SS_SELFTEST == 'true'
        run: |
          bash .github/scripts/ssh_selftest.sh || {
            echo "WARN: SSH self-test reported a problem — see logs above."
          }

      - name: Setup Tailscale (persistent identity)
        run: bash .github/scripts/tailscale-setup.sh

      - name: Record server identity state
        run: |
          jq -n \
            --arg boot_ts "${BOOT_TS}" \
            --arg run_id "${GITHUB_RUN_ID:-?}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --arg ip "${TS_IP:-pending}" \
            --arg host "${TS_HOSTNAME}" \
            --arg hostkey_sha "$(ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub 2>/dev/null | awk '{print $2}' || echo unknown)" \
            --arg root_marker "$(head -1 /root/persist-marker.txt 2>/dev/null || echo fresh)" \
            '{boot_ts:$boot_ts, run_id:$run_id, attempt:$attempt, ts_ip:$ip, ts_hostname:$host, host_key_fp_ed25519:$hostkey_sha, restored_root_marker:$root_marker}' \
            > /root/.server-state.json
          echo "identity recorded: $(cat /root/.server-state.json)"

      - name: Initial state snapshot (early persistence)
        run: |
          if timeout 420 bash .github/scripts/save.sh; then
            echo "Initial state snapshot OK"
          else
            echo "WARN: initial snapshot failed — periodic auto-sync will retry"
          fi

      - name: Verify and report
        run: bash .github/scripts/server_report.sh

      - name: Keep server alive (periodic auto-sync + final save on lifetime end / signal)
        run: |
          LIFETIME_MIN=$(echo "${LIFETIME_MIN:-350}" | grep -Eo '^[0-9]+$' || echo 350)
          if [ "$LIFETIME_MIN" -lt 1 ]; then LIFETIME_MIN=5; fi
          if [ "$LIFETIME_MIN" -gt 355 ]; then LIFETIME_MIN=355; fi
          echo "Server lifetime: ${LIFETIME_MIN} minutes (root-first)"
          FLUSHED=0
          SYNC_PID=""
          do_save() {
            if timeout 420 bash .github/scripts/save.sh; then echo "[save] OK"; else echo "[save] WARN rc=$?"; fi
          }
          flush_sync() {
            if [ "$FLUSHED" = "0" ]; then
              FLUSHED=1
              [ -n "$SYNC_PID" ] && kill -9 "$SYNC_PID" 2>/dev/null || true
              echo "[keepalive] termination — final save..."
              do_save
            fi
          }
          trap 'flush_sync; exit 0' SIGTERM SIGINT SIGQUIT SIGHUP
          (
            INTERVAL=$(( ${SAVE_INTERVAL_MIN:-5} * 60 ))
            while true; do
              sleep "$INTERVAL"
              echo "[auto-sync $(date -u '+%T')] periodic save..."
              timeout 420 bash .github/scripts/save.sh && echo "[auto-sync] OK" || echo "[auto-sync] WARN"
            done
          ) &
          SYNC_PID=$!
          END_TS=$(( $(date +%s) + LIFETIME_MIN * 60 ))
          while [ "$(date +%s)" -lt "$END_TS" ]; do
            sleep 3 || break
          done
          kill -9 "$SYNC_PID" 2>/dev/null || true
          echo "[keepalive] lifetime reached — final save (in this step)..."
          do_save
          echo "[keepalive] done."
