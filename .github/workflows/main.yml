name: Linux-server — Persistent Ubuntu (Tailscale + Releases)

# ============================================================================
# سرور Ubuntu پایدار روی GitHub Actions
# - حفظ دائمی داده‌ها و فایل‌های کاربر (/home/Hamid, /root, /etc, /opt, /srv, /var/www, /usr/local)
# - بازیابی خودکار نرم‌افزارها و پکیج‌های نصب‌شده
# - پایداری هویت و IP ثابت Tailscale (/var/lib/tailscale)
# - کلید SSH دائمی و اتصال بدون نیاز به ساخت کلید جدید
# - دسترسی کامل مدیریتی و sudo su بدون رمز
# - مدیریت پایدار Release در مخزن Linux-server-state بدون ایجاد بکاپ‌های تکراری
# ============================================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'        # هر ۵ ساعت (UTC)
  repository_dispatch:

concurrency:
  group: linux-server-persistent
  cancel-in-progress: false       # run جدید در صف می‌ماند تا ذخیره‌سازی نهایی run قبلی تکمیل شود

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # کمی کمتر از ۶ ساعت جهت تضمین ذخیرهٔ نهایی قبل از اتمام زمان

    permissions:
      contents: read

    env:
      STATE_TAG: state
      PERSIST_REPO: hrgh3d/Linux-server-state
      PERSIST_TOKEN: ${{ secrets.PERSIST_TOKEN }}
      TS_HOSTNAME: linux-server-vps
      HAMID_PASSWORD: ${{ secrets.HAMID_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN || 'NOT_SET' }}
      SAVE_INTERVAL_MIN: '10'     # همگام‌سازی دوره‌ای هر ۱۰ دقیقه در پس‌زمینه

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup base system
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server sudo curl wget git tar rsync jq python3 || true
          
          # ثبت لیست پکیج‌های پیش‌فرض برای مقایسه در ذخیره‌سازی بعدی
          if command -v apt-mark &>/dev/null; then
            apt-mark showmanual | sort > /tmp/base_manual_packages.list || true
          fi
          echo "Base system ready"

      - name: Create user Hamid and configure sudo
        run: |
          set -euo pipefail
          if ! id Hamid &>/dev/null; then
            sudo useradd -m -s /bin/bash Hamid
          fi
          if [ -n "${HAMID_PASSWORD:-}" ]; then
            echo "Hamid:${HAMID_PASSWORD}" | sudo chpasswd
          fi
          sudo usermod -aG sudo Hamid
          
          # دسترسی sudo بدون رمز برای کاربر Hamid
          echo 'Hamid ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/hamid >/dev/null
          sudo chmod 0440 /etc/sudoers.d/hamid
          sudo chown 0:0 /etc/sudoers.d/hamid
          
          # کاربر root بدون پسورد (دسترسی مستقیم با sudo su)
          sudo passwd -d root || true
          
          sudo mkdir -p /home/Hamid
          sudo chown -R Hamid:Hamid /home/Hamid
          echo "User Hamid and root configured (passwordless sudo enabled)"

      - name: Restore persistent state (from state repo)
        run: bash .github/scripts/restore.sh

      - name: Verify restored state (marker)
        run: |
          echo "=== Hamid Persist Marker ==="
          cat /home/Hamid/persist-marker.txt 2>/dev/null || echo "No marker in Hamid home (fresh run)"
          echo "=== Root Persist Marker ==="
          cat /root/persist-marker.txt 2>/dev/null || echo "No marker in root (fresh run)"

      - name: Configure SSH (fixed public key + config)
        run: |
          set -euo pipefail
          sudo cp .github/config/sshd_config /etc/ssh/sshd_config
          
          # کلید عمومی ثابت برای کاربر Hamid
          sudo mkdir -p /home/Hamid/.ssh
          sudo cp .github/ssh/id_ed25519.pub /home/Hamid/.ssh/authorized_keys
          sudo chmod 700 /home/Hamid/.ssh
          sudo chmod 600 /home/Hamid/.ssh/authorized_keys
          sudo chown -R Hamid:Hamid /home/Hamid/.ssh
          
          # کلید عمومی برای root
          sudo mkdir -p /root/.ssh
          sudo cp .github/ssh/id_ed25519.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo chown -R root:root /root/.ssh
          
          sudo service ssh restart || sudo systemctl restart ssh || sudo systemctl restart sshd || true
          echo "authorized_keys fingerprint: $(ssh-keygen -lf /home/Hamid/.ssh/authorized_keys | awk '{print $2}')"
          echo "SSH configured with fixed public key"

      - name: Setup Tailscale (persistent identity)
        run: bash .github/scripts/tailscale-setup.sh

      - name: Print connection info
        env:
          TS_IP: ${{ env.TS_IP }}
        run: |
          echo "=============================================="
          echo "User: Hamid"
          echo "Tailscale IP: ${TS_IP:-pending}"
          echo "MagicDNS hostname: ${TS_HOSTNAME}"
          echo "Connect command: ssh -i <your-private-key> Hamid@${TS_IP:-<tailscale-ip>}"
          echo "=============================================="
          {
            echo "## 🟢 Linux-server is Ready"
            echo ""
            echo "- **User:** Hamid"
            echo "- **Tailscale IP:** \`${TS_IP:-pending}\`"
            echo "- **MagicDNS:** \`${TS_HOSTNAME}\`"
            echo "- **Root Access:** \`sudo su\` (passwordless)"
            echo "- **SSH Command:** \`ssh -i <private-key> Hamid@${TS_IP:-<tailscale-ip>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep server alive
        run: |
          echo "Server is alive and operational."
          
          # همگام‌سازی دوره‌ای در پس‌زمینه
          if [ "${SAVE_INTERVAL_MIN:-0}" -gt 0 ] 2>/dev/null; then
            echo "Background auto-sync enabled (every ${SAVE_INTERVAL_MIN} min)"
            (
              while true; do
                sleep $(( SAVE_INTERVAL_MIN * 60 ))
                echo "[auto-sync] Running periodic state save..."
                bash .github/scripts/save.sh || echo "[auto-sync] Warning: periodic save skipped"
              done
            ) &
            SYNC_PID=$!
          fi
          
          # مدیریت پاسخگویی فوری به سیگنال‌های توقف / Cancel
          trap 'echo "Termination signal received, shutting down gracefully..."; [ -n "${SYNC_PID:-}" ] && kill -9 $SYNC_PID 2>/dev/null || true; exit 0' SIGTERM SIGINT SIGQUIT SIGHUP
          
          # نگه‌داشتن سرور با قابلیت دریافت فوری Signal
          END_TIME=$(( $(date +%s) + 19800 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 2 &
            wait $!
          done

      - name: Final state save
        if: always()
        run: |
          echo "Executing final state save..."
          bash .github/scripts/save.sh || echo "Warning: final save encountered a non-fatal issue"
