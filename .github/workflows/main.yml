name: Linux-server — Persistent Ubuntu (Tailscale + Releases)

# ============================================================================
#  هدف: سروری که هر چند ساعت با runner جدید جایگزین می‌شود اما داده‌ها،
#  برنامه‌ها، کلید SSH و آدرس Tailscale آن همیشه ثابت می‌مانند.
#
#  مدل ذخیره‌سازی:
#    - state.tar.gz روی یک Release چرخشی (tag: state) در همین مخزن نگهداری می‌شود
#      (نه داخل git) → فایل‌های حجیم تاریخچهٔ git را باد نمی‌کنند.
#    - در شروع هر run، restore.sh آخرین state را دانلود و بازیابی می‌کند.
#    - در پایان هر run (و هر ۳۰ دقیقه در حین اجرا)، save.sh state جدید را
#      روی همان Release آپلود می‌کند. پس حتی اگر run به صورت دستی cancel شود
#      (قدم‌های if: always) آخرین وضعیت ذخیره می‌شود.
#
#  نکته‌ی زمان‌بندی:
#    - cron هر ۵ ساعت یک run صف می‌کند؛ هر run حدود ۵ ساعت و ۴۵ دقیقه زنده
#      می‌ماند. به کمک concurrency (cancel-in-progress: false) run بعدی تا پایان
#      run قبلی در صف می‌ماند → هرگز دو سرور همزمان بالا نیستند و وقفه تقریباً صفر است.
# ============================================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'        # هر ۵ ساعت (UTC)
  repository_dispatch:

# تضمین می‌کند که همیشه فقط یک نمونه از سرور فعال باشد
concurrency:
  group: linux-server-persistent
  cancel-in-progress: false       # run جدید صف می‌شود، run فعال cancel نمی‌شود

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # کمی کمتر از سقف ۶ ساعته تا فرصت ذخیرهٔ نهایی بماند

    permissions:
      contents: write             # لازم برای دانلود/آپلود Release و state

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      STATE_TAG: state
      TS_HOSTNAME: linux-server-vps
      HAMID_PASSWORD: ${{ secrets.HAMID_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN || 'NOT_SET' }}
      TAILSCALE_FIXED_IP: ${{ secrets.TAILSCALE_FIXED_IP || '100.100.100.100' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── بازیابی وضعیت قبلی از Release (اولین قدم، تا بقیه‌ی قدم‌ها روی داده‌های قبلی کار کنند)
      - name: Restore persistent state (from GitHub Releases)
        run: bash .github/scripts/restore.sh

      - name: Setup base system
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openssh-server sudo curl wget git tar rsync jq || true
          echo "Base system ready"

      - name: Create user Hamid
        run: |
          set -euo pipefail
          if ! id Hamid &>/dev/null; then
            sudo useradd -m -s /bin/bash Hamid
          fi
          echo "Hamid:${HAMID_PASSWORD}" | sudo chpasswd
          sudo usermod -aG sudo Hamid
          sudo mkdir -p /home/Hamid
          sudo chown -R Hamid:Hamid /home/Hamid
          echo "User Hamid ready"

      # ── کلید SSH ثابت: فقط کلید عمومی در مخزن است؛ کلید خصوصی نزد کاربر می‌ماند
      - name: Configure SSH (fixed public key + config)
        run: |
          set -euo pipefail
          sudo cp .github/config/sshd_config /etc/ssh/sshd_config
          sudo mkdir -p /home/Hamid/.ssh
          sudo cp .github/ssh/id_ed25519.pub /home/Hamid/.ssh/authorized_keys
          sudo chmod 700 /home/Hamid/.ssh
          sudo chmod 600 /home/Hamid/.ssh/authorized_keys
          sudo chown -R Hamid:Hamid /home/Hamid/.ssh
          sudo service ssh restart || sudo systemctl restart ssh || true
          echo "SSH configured with fixed public key"

      # ── Tailscale: نصب، اتصال، پاک‌سازی nodeهای قدیمی و تثبیت IP
      - name: Setup Tailscale (fixed IP + stale node cleanup)
        run: bash .github/scripts/tailscale-setup.sh

      - name: Print connection info
        env:
          TS_IP: ${{ env.TS_IP }}
        run: |
          echo "=============================================="
          echo "User: Hamid"
          echo "Tailscale IP: ${TS_IP:-pending}"
          echo "MagicDNS name: ${TS_HOSTNAME}"
          echo "Connect: ssh -i <private-key> Hamid@${TS_IP:-<tailscale-ip>}"
          echo "=============================================="
          mkdir -p artifacts
          {
            echo "User: Hamid"
            echo "Tailscale IP: ${TS_IP:-pending}"
            echo "MagicDNS name: ${TS_HOSTNAME}"
            echo "Command: ssh -i <private-key> Hamid@${TS_IP:-<tailscale-ip>}"
          } > artifacts/connection-info.txt
          {
            echo "## 🟢 Linux-server ready"
            echo ""
            echo "- **User:** Hamid"
            echo "- **Tailscale IP:** ${TS_IP:-pending}"
            echo "- **MagicDNS:** ${TS_HOSTNAME}"
            echo "- **Connect:** \`ssh -i <private-key> Hamid@${TS_IP:-<tailscale-ip>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload connection info artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connection-info
          path: artifacts/
          retention-days: 30
          if-no-files-found: ignore

      # ── عمر سرور: در پس‌زمینه هر ۳۰ دقیقه ذخیره می‌شود
      - name: Keep server alive
        run: |
          echo "Server alive. State is auto-saved every 30 minutes (background)."
          (
            while true; do
              sleep 1800
              bash .github/scripts/save.sh || echo "periodic save skipped"
            done
          ) &
          sleep 19800 || true

      # ── ذخیرهٔ نهایی (حتی در صورت cancel شدن run هم اجرا می‌شود)
      - name: Final state save
        if: always()
        run: bash .github/scripts/save.sh || echo "final save failed (non-critical)"

      - name: Upload final state artifact (backup copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-backup
          path: state.tar.gz
          retention-days: 90
          if-no-files-found: ignore
