name: Linux-server — Persistent Ubuntu (Tailscale + Releases) [v6.8]

# ============================================================================
# سرور Ubuntu پایدار روی GitHub Actions — معماری v6.0 (شاخه AI، بدون VPN)
#
#  v6.0 نسبت به v5.1 (پورت زیرساخت + autostart ایجنت):
#    - پورت اصلاحات کپی اول (timeout روی up ها، بازسازی state، fail-fast،
#      None-safety و fingerprint-loop) — بدون هیچ جزء VPN.
#    - زنجیره جانشین خودکار (successor self-dispatch با SUCCESSOR_TOKEN؛ گارد
#      lifetime<60؛ کرون backstop) — قطعی فقط چند دقیقه ریبیلد.
#    - هشدار انقضای کلیدها در هر بوت (node key + auth key + key-dates.json).
#    - اجرای خودکار ایجنت بعد از بوت (/root/agent-autostart.sh، غیرfatal).
#    - بدون Tailscale SSH در ثبت‌های تازه (ورود فقط با کلید؛ بدون تأییدیه).
#    - لاگ‌های بهداشتی برای ریپوی عمومی + وبهوک Discord/Telegram در notify.sh.
#
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      lifetime_min:
        description: 'طول عمر سرور به دقیقه. برای تست خیلی کم بگذارید (مثلا 5)؛ پیش‌فرض نهایی 350 ≈ 5.8h (سقف 355)'
        required: false
        default: '350'
        type: string
      probe:
        description: 'نوشتن فایل تست در مسیرهای گوناگون + نصب پکیج apt تستی (راستی‌آزمایی مسیر/نام-آگنوستیک و کاتالوگ)'
        required: false
        default: 'false'
        type: string
      selftest:
        description: 'تست محلی SSH (ورود root با کلید، sudo بدون رمز)'
        required: false
        default: 'true'
        type: string
      provision:
        description: 'نصب خودکار اپ‌ها در صورت نبود: 9router / Hermes / 3x-ui'
        required: false
        default: 'true'
        type: string
  schedule:
    - cron: '0 */3 * * *'        # هر ۳ ساعت (v6.9: backstop سریع‌تر برای کاهش قطعی) (UTC)
  repository_dispatch:

# concurrency بر اساس trigger جدا شده است تا Manual Dispatch پشت Cron در صف
# نماند. cancel-in-progress عمداً false است (Cron نباید خودکار یک سرور Manual را
# بکشد)؛ کنترل با قدم «Single-instance coordination» انجام می‌شود:
#   manual -> سایر runها (auto و manual) را Cancel می‌کند
#   auto   -> اگر Manual در حال اجراست خودش Cancel می‌شود؛ وگرنه auto قدیمی را
#             Cancel (جایگزین) می‌کند تا فقط یک سرور فعال باشد.
concurrency:
  group: linux-server-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # حداکثر مجاز GitHub ≈ ۶ ساعت

    # همه‌ی steps با shell ریشه اجرا می‌شوند (root-first؛ بدون نیاز به sudo su)
    # NOTE: GitHub executes custom shell templates WITHOUT a shell, so no
    # "$PATH" expansion happens here (that broke with literal PATH=$PATH).
    # sudo -E already preserves the runner's PATH/env; we only pin HOME=/root.
    defaults:
      run:
        shell: sudo -E env HOME=/root bash -e {0}

    permissions:
      contents: read
      actions: write        # برای Cancel/هماهنگ‌سازی runها در Single-instance coordination

    env:
      STATE_TAG: state
      PERSIST_REPO: hrgh3d/Linux-server-state
      PERSIST_TOKEN: ${{ secrets.PERSIST_TOKEN }}
      SUCCESSOR_TOKEN: ${{ secrets.SUCCESSOR_TOKEN || secrets.PERSIST_TOKEN }}
      # نام این node روی تلنت خودش؛ cleanup فقط هم‌نام‌های آفلاین را حذف می‌کند.
      # تا tailscale_cleanup هیچ‌کدام دیگری را حذف نکند. IP خودکار (ثابت پس از ثبت).
      TS_HOSTNAME: linux-server-vps
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN || 'NOT_SET' }}
      TAILSCALE_FIXED_IP: ${{ secrets.TAILSCALE_FIXED_IP || '' }}
      HAMID_PASSWORD: ${{ secrets.HAMID_PASSWORD }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL || '' }}
      SAVE_INTERVAL_MIN: '5'      # همگام‌سازی دوره‌ای (فقط در صورت تغییر)
      LIFETIME_MIN: ${{ inputs.lifetime_min || '350' }}
      PROBE_ENABLED: ${{ inputs.probe || 'false' }}
      SS_SELFTEST: ${{ inputs.selftest || 'true' }}
      PROVISION_ENABLED: ${{ inputs.provision || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Single-instance coordination (manual preempts auto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - "$GH_TOKEN" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" <<'PY'
          import json, os, sys, time, urllib.request, urllib.error
          tok, run_id, event, repo = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          api = "https://api.github.com"
          def req(method, path):
              r = urllib.request.Request(api + path, method=method, headers={
                  "Authorization": "Bearer " + tok,
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "linux-server-coord",
              })
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(f"[coord] HTTP {e.code} on {method} {path}", flush=True)
                  return {}
          def list_runs(status):
              runs, page = [], 1
              while True:
                  d = req("GET", f"/repos/{repo}/actions/workflows/main.yml/runs?status={status}&per_page=100&page={page}")
                  arr = d.get("workflow_runs", [])
                  runs += arr
                  if len(arr) < 100:
                      break
                  page += 1
              return runs
          others = []
          for st in ("in_progress", "queued"):
              for r in list_runs(st):
                  if r.get("id") != int(run_id):
                      others.append(r)
          mine_event = event
          is_auto = mine_event in ("schedule", "repository_dispatch")
          print(f"[coord] run={run_id} event={mine_event} others_in_progress_or_queued={len(others)}", flush=True)
          if not is_auto:
              # workflow_dispatch: manual preempts everything else
              for r in others:
                  print(f"[coord] manual cancelling run {r['id']} ({r.get('event')}) ...", flush=True)
                  req("POST", f"/repos/{repo}/actions/runs/{r['id']}/cancel")
          else:
              manuals = [r for r in others if r.get("event") == "workflow_dispatch"]
              if manuals:
                  print("[coord] auto run yields to manual — self-cancelling", flush=True)
                  req("POST", f"/repos/{repo}/actions/runs/{run_id}/cancel")
                  for _ in range(20):
                      time.sleep(3)
                      d = req("GET", f"/repos/{repo}/actions/runs/{run_id}")
                      if d.get("status") == "completed":
                          break
                  print("[coord] self-cancelled", flush=True)
                  sys.exit(3)
              autos = [r for r in others if r.get("event") in ("schedule", "repository_dispatch")]
              for r in sorted(autos, key=lambda x: x.get("created_at", "")):
                  print(f"[coord] auto replacing older auto run {r['id']} ({r.get('event')}) ...", flush=True)
                  req("POST", f"/repos/{repo}/actions/runs/{r['id']}/cancel")
          print("[coord] proceeding", flush=True)
          PY

      - name: Init boot context
        run: |
          BOOT_TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "BOOT_TS=${BOOT_TS}" >> "$GITHUB_ENV"
          echo "Boot started: ${BOOT_TS} (run ${GITHUB_RUN_ID}, attempt ${GITHUB_RUN_ATTEMPT:-1})"
          mkdir -p /root /home/Hamid
          echo "boot_ts=${BOOT_TS} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT:-1} event=${GITHUB_EVENT_NAME}" >> /root/server.log
          echo "Running as: $(id -un) (uid $(id -u)) — root-first mode"
          echo "BOOT_ID=${BOOT_TS}" >> "$GITHUB_ENV"

      - name: Setup base system + image baselines
        run: |
          # v6.9.1: resilient apt with retries (fixes transient mirror failures)
          for i in 1 2 3 4 5; do
            echo "[apt] update attempt $i..."
            if apt-get update -y; then
              echo "[apt] update OK"
              break
            fi
            echo "[apt] update failed, retrying in 10s..."
            sleep 10
            if [ $i -eq 5 ]; then
              echo "[apt] WARNING: apt-get update failed after 5 attempts, continuing anyway"
            fi
          done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 \
            openssh-server sudo curl wget git tar rsync jq python3 ca-certificates nodejs npm \
            || DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 \
            openssh-server sudo curl wget git tar rsync jq python3 ca-certificates \
            || { echo "[apt] install failed, retrying..."; sleep 10; DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 openssh-server sudo curl wget git tar rsync jq python3 ca-certificates || true; }
          # baseline های image برای محاسبه‌ی «آنچه کاربر اضافه کرده» در save
          timeout 60 apt-mark showmanual | sort > /tmp/base_manual_packages.list || true
          npm ls -g --depth=0 --json 2>/dev/null | jq -r '.dependencies | keys[]' | sort > /tmp/base_npm.list || true
          pip3 list --format=freeze 2>/dev/null | cut -d= -f1 | sort > /tmp/base_pip.list || true
          ls -A1 /opt 2>/dev/null > /tmp/base_opt_entries.list || true
          ls -A1 /usr/local/bin 2>/dev/null > /tmp/base_usrlocalbin.list || true
          ls -A1 /usr/local/sbin 2>/dev/null > /tmp/base_usrlocalsbin.list || true
          ls -A1 /var/lib 2>/dev/null > /tmp/base_varlib_entries.list || true
          echo "baselines: apt=$(wc -l < /tmp/base_manual_packages.list 2>/dev/null || echo 0) npm=$(wc -l < /tmp/base_npm.list 2>/dev/null || echo 0) pip=$(wc -l < /tmp/base_pip.list 2>/dev/null || echo 0) opt=$(wc -l < /tmp/base_opt_entries.list 2>/dev/null || echo 0) varlib=$(wc -l < /tmp/base_varlib_entries.list 2>/dev/null || echo 0)"
          echo "Base system ready"

      - name: Create root/Hamid accounts (root-first)
        run: |
          # v6.8: پسورد قوی برای root (درخواست کاربر)
          if [ -n "${HAMID_PASSWORD:-}" ]; then echo "root:${HAMID_PASSWORD}" | chpasswd; else passwd -d root || true; fi
          # کاربر Hamid (اختیاری) با sudo بدون رمز
          if ! id Hamid &>/dev/null; then useradd -m -s /bin/bash Hamid; fi
          usermod -aG sudo Hamid
          if [ -n "${HAMID_PASSWORD:-}" ]; then echo "Hamid:${HAMID_PASSWORD}" | chpasswd; fi  # v6.8: برگشت پسورد
          echo 'Hamid ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/hamid
          chmod 0440 /etc/sudoers.d/hamid
          mkdir -p /home/Hamid && chown -R Hamid:Hamid /home/Hamid
          echo "root passwordless; Hamid NOPASSWD sudo; job runs as root"

      - name: Restore — prep (download state + reinstall catalog packages)
        run: bash .github/scripts/restore.sh prep

      - name: Provision persistent apps (9router / Hermes / 3x-ui if missing)
        if: env.PROVISION_ENABLED == 'true'
        run: bash .github/scripts/provision.sh

      - name: Restore — apply (config/data payload over reinstalled packages)
        run: bash .github/scripts/restore.sh apply

      - name: Remove disabled apps (3x-ui) - user request v6.9.2
        run: |
          echo "[cleanup] Removing 3x-ui panel permanently (user disabled)..."
          sudo systemctl stop x-ui >/dev/null 2>&1 || true
          sudo systemctl disable x-ui >/dev/null 2>&1 || true
          sudo rm -rf /etc/x-ui /usr/local/x-ui /etc/systemd/system/x-ui.service /etc/systemd/system/multi-user.target.wants/x-ui.service
          sudo systemctl daemon-reload >/dev/null 2>&1 || true
          sudo systemctl reset-failed >/dev/null 2>&1 || true
          echo "[cleanup] 3x-ui removed, will not return in future runs" 

      - name: Start persistent apps (Hermes dashboard/tunnel/gateway)
        run: bash .github/scripts/start-services.sh
      - name: Write persistence probe (new paths + second apt pkg)
        if: env.PROBE_ENABLED == 'true'
        run: |
          TS=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "== run=${GITHUB_RUN_ID} boot=${BOOT_TS} =="
          # (a) /root — مسیر آشنا
          mkdir -p /root/persistence-probe
          [ -f /root/persistence-probe/root.txt ] && echo "RESTORED /root/persistence-probe/root.txt" || echo "PROBE root.txt $TS" > /root/persistence-probe/root.txt
          cat /root/persistence-probe/root.txt 2>/dev/null
          # (b) مسیر و نام کاملاً جدید در /var/lib (Path/Name-agnostic)
          mkdir -p /var/lib/persistence-probe-z9x
          [ -f /var/lib/persistence-probe-z9x/state.data ] && echo "RESTORED /var/lib/...z9x/state.data" || echo "PROBE state.data $TS" > /var/lib/persistence-probe-z9x/state.data
          cat /var/lib/persistence-probe-z9x/state.data 2>/dev/null
          # (c) فایل کانفیگ با نام جدید در /etc
          [ -f /etc/persistence-probe.conf ] && echo "RESTORED /etc/persistence-probe.conf" || echo "PROBE etc $TS" > /etc/persistence-probe.conf
          cat /etc/persistence-probe.conf 2>/dev/null
          # (d) پکیج apt تستی دوم (کاتالوگ apt) — cowsay در /usr/games است،
          #     بنابراین وجود آن با dpkg سنجیده می‌شود نه PATH.
          if dpkg -s cowsay >/dev/null 2>&1; then
            echo "cowsay RESTORED by catalog ($(dpkg-query -W -f='${Version}' cowsay 2>/dev/null))"
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y -o DPkg::Lock::Timeout=120 cowsay >/dev/null 2>&1 && echo "cowsay INSTALLED fresh" || echo "WARN cowsay"
          fi

      - name: Configure SSH (fixed key + host keys) — root login
        run: bash .github/scripts/ssh_configure.sh

      - name: SSH local self-test (root key login, passwordless sudo/su)
        if: env.SS_SELFTEST == 'true'
        run: |
          bash .github/scripts/ssh_selftest.sh || {
            echo "WARN: SSH self-test reported a problem — see logs above."
          }

      - name: Setup Tailscale (persistent identity)
        run: bash .github/scripts/tailscale-setup.sh

      - name: Record server identity state
        run: |
          jq -n \
            --arg boot_ts "${BOOT_TS}" \
            --arg run_id "${GITHUB_RUN_ID:-?}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --arg ip "${TS_IP:-pending}" \
            --arg host "${TS_HOSTNAME}" \
            --arg hostkey_sha "$(ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub 2>/dev/null | awk '{print $2}' || echo unknown)" \
            --arg root_marker "$(head -1 /root/persist-marker.txt 2>/dev/null || echo fresh)" \
            '{boot_ts:$boot_ts, run_id:$run_id, attempt:$attempt, ts_ip:$ip, ts_hostname:$host, host_key_fp_ed25519:$hostkey_sha, restored_root_marker:$root_marker}' \
            > /root/.server-state.json
          echo "identity recorded: $(cat /root/.server-state.json)"

      - name: Initial state snapshot (early persistence)
        run: |
          run_snapshot() {
            if timeout 420 bash .github/scripts/save.sh; then
              echo "Initial state snapshot OK"
              return 0
            fi
            return 1
          }
          if run_snapshot; then
            :
          else
            echo "initial snapshot failed — retrying once after 20s"
            sleep 20
            if run_snapshot; then
              :
            else
              bash .github/scripts/notify.sh --type backup --stage initial-snapshot \
                --error "initial state snapshot failed after retry (upload skipped; previous state kept)" || true
              echo "ERROR: initial state snapshot failed twice"
              exit 1
            fi
          fi

      - name: Verify and report
        run: bash .github/scripts/server_report.sh

      - name: Agent autostart (AI resume after boot)
        run: |
          if [ -x /root/agent-autostart.sh ]; then
            echo "[autostart] running /root/agent-autostart.sh ..."
            timeout 300 bash /root/agent-autostart.sh >/var/log/agent-autostart.log 2>&1 || \
              echo "[autostart] WARNING: autostart script failed (non-fatal, see /var/log/agent-autostart.log)"
          else
            echo "[autostart] no /root/agent-autostart.sh — skipping"
          fi

      - name: Keep server alive (serial auto-sync + verified final save)
        run: |
          SCRIPT_DIR=.github/scripts
          LIFETIME_MIN=$(echo "${LIFETIME_MIN:-350}" | grep -Eo '^[0-9]+$' || echo 350)
          if [ "$LIFETIME_MIN" -lt 1 ]; then LIFETIME_MIN=5; fi
          if [ "$LIFETIME_MIN" -gt 355 ]; then LIFETIME_MIN=355; fi
          echo "Server lifetime: ${LIFETIME_MIN} minutes (root-first) - v6.9 early successor"
          INTERVAL=$(( ${SAVE_INTERVAL_MIN:-5} * 60 ))
          CONSEC=0
          check_tailscale() {
            local _on _ip _derp
            _on=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.Online // false' 2>/dev/null || echo false)
            _ip=$(sudo tailscale ip -4 2>/dev/null | head -1 || true)
            if [ "$_on" = "true" ] && [ -n "$_ip" ]; then
              _derp=$(sudo tailscale netcheck --format=json 2>/dev/null | jq -r '[.DERPLatency // {} | to_entries[] | select(.value > 0)] | length' 2>/dev/null || echo 1)
              if [ "${_derp:-1}" -ge 1 ] 2>/dev/null; then return 0; fi
              echo "[watchdog] Tailscale online (${_ip}) but no DERP reachable — healing..."
            else
              echo "[watchdog] Tailscale unhealthy (online=${_on} ip=${_ip:-none}) — healing..."
            fi
            if ! sudo systemctl restart tailscaled >/dev/null 2>&1; then
              sudo pkill -x tailscaled >/dev/null 2>&1 || true; sleep 1
              sudo nohup tailscaled --state=/var/lib/tailscale/tailscaled.state >/var/log/tailscaled.log 2>&1 &
            fi
            sleep 12
            sudo tailscale up --hostname="${TS_HOSTNAME:-linux-server-vps}" --accept-routes >/dev/null 2>&1 || true
            sleep 5
            _on=$(sudo tailscale status --json 2>/dev/null | jq -r '.Self.Online // false' 2>/dev/null || echo false)
            if [ "$_on" = "true" ]; then
              echo "[watchdog] healed (online again)"
            else
              echo "[watchdog] STILL unhealthy after restart — recorded (non-fatal)"
              bash "$SCRIPT_DIR/notify.sh" --type server --stage tailscale-watchdog --error "mid-run heal failed (online=${_on})" || true
            fi
            return 0
          }
          do_save() {
            if timeout 300 bash "$SCRIPT_DIR/save.sh"; then return 0; else return 1; fi
          }
          dispatch_successor() {
            local _tok="${SUCCESSOR_TOKEN:-NOT_SET}" _code
            if [ -z "$_tok" ] || [ "$_tok" = "NOT_SET" ]; then
              echo "[successor] no token — skipping (schedule ticks remain as backstop)"
              return 1
            fi
            _code=$(curl -s -o /tmp/successor_resp.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Authorization: Bearer ${_tok}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/dispatches" \
              -d '{"ref":"main","inputs":{"lifetime_min":"350"}}' 2>/dev/null || echo "000")
            echo "[successor] dispatch HTTP=${_code} $(head -c 160 /tmp/successor_resp.json 2>/dev/null || true)"
            [ "$_code" = "204" ]
          }
          final_save() {
            echo "[keepalive] final save..."
            if do_save; then echo "[save] FINAL OK"; return 0; fi
            echo "[save] FINAL FAILED"
            return 1
          }
          flush_on_signal() {
            echo "[keepalive] termination signal — running final save..."
            final_save
          }
          trap 'flush_on_signal || exit 1; exit 0' TERM INT QUIT HUP
          END_TS=$(( $(date +%s) + LIFETIME_MIN * 60 ))
          LAST_AUTO=$(date +%s)
          SUCCESSOR_AT=$(( END_TS - 1200 ))  # v6.9: 20min early dispatch for minimal downtime
          SUCCESSOR_DISPATCHED=0
          SUCCESSOR_RETRY_AT=$(( END_TS - 600 ))  # 10min fallback
          if [ "$LIFETIME_MIN" -lt 60 ]; then
            SUCCESSOR_DISPATCHED=1
            echo "[successor] short test run (lifetime<60) — successor dispatch disabled"
          fi
          while :; do
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END_TS" ]; then
              break
            fi
            if [ "$SUCCESSOR_DISPATCHED" -eq 0 ] && [ "$NOW" -ge "$SUCCESSOR_AT" ]; then
              SUCCESSOR_DISPATCHED=1
              echo "[successor] lifetime ends in <20min — dispatching replacement run (v6.9 early)..."
              if dispatch_successor; then
                echo "[successor] replacement dispatched OK — new run should be pending/in_progress now, will take over after final save"
              else
                echo "[successor] first dispatch failed — retrying in 60s..."
                sleep 60
                if dispatch_successor; then
                  echo "[successor] retry OK — successor dispatched"
                else
                  echo "[successor] WARNING: replacement dispatch failed after retry (schedule backstop in max 3h)"
                  bash "$SCRIPT_DIR/notify.sh" --type server --stage successor-dispatch \
                    --error "Replacement run dispatch failed — server will stop at lifetime end; next schedule tick (3h) is backstop." || true
                fi
              fi
            fi
            # fallback check at 10min before end if no successor seen
            if [ "$SUCCESSOR_DISPATCHED" -eq 1 ] && [ "$NOW" -ge "$SUCCESSOR_RETRY_AT" ] && [ "$NOW" -lt $((END_TS - 300)) ]; then
              # only once at 10min mark
              if [ "$SUCCESSOR_RETRY_AT" -ne 0 ]; then
                SUCCESSOR_RETRY_AT=0
                echo "[successor] 10min fallback check..."
                # list in_progress runs quickly
                if ! curl -s --max-time 15 -H "Authorization: Bearer ${SUCCESSOR_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=10" 2>/dev/null | grep -q '"id"'; then
                  echo "[successor] API check inconclusive"
                fi
                # we don't auto-dispatch again here to avoid loop, just log - the first dispatch should have queued new run
                echo "[successor] fallback check done — if new run not visible, it will be queued shortly"
              fi
            fi
            if [ $(( NOW - LAST_AUTO )) -ge "$INTERVAL" ]; then
              echo "[auto-sync $(date -u '+%T')] periodic save..."
              if do_save; then
                echo "[auto-sync] OK"
                CONSEC=0
              else
                CONSEC=$(( CONSEC + 1 ))
                echo "[auto-sync] FAILED (consecutive=${CONSEC})"
                if [ "$CONSEC" -ge 3 ]; then
                  bash "$SCRIPT_DIR/notify.sh" --type backup --stage auto-sync \
                    --error "3 consecutive periodic saves failed — aborting server (last healthy state kept)" || true
                  echo "[keepalive] too many consecutive save failures — ending run as failure"
                  exit 1
                fi
              fi
              LAST_AUTO="$NOW"
              check_tailscale || true
            fi
            sleep 3
          done
          echo "[keepalive] lifetime reached — final save"
          if final_save; then
            echo "[keepalive] done."
          else
            bash "$SCRIPT_DIR/notify.sh" --type backup --stage final-save \
              --error "final save at lifetime end FAILED (last healthy state kept)" || true
            echo "[keepalive] ERROR: final save failed"
            exit 1
          fi


      - name: Notify on job failure (active failure notification)
        if: always() && job.status == 'failure'
        run: |
          ERR="workflow job failed"
          if [ -s /tmp/failure-notify.json ]; then
            ERR="$(python3 -c 'import json;d=json.load(open("/tmp/failure-notify.json"));print(d["events"][-1].get("error",""))' 2>/dev/null || true)"
          fi
          bash .github/scripts/notify.sh --type workflow --stage job-failure --error "${ERR:-job failed}" || true
          echo "run failed — failure notified (GitHub email/notification also applies)"
          exit 0

      - name: Report success / deferred warnings
        if: always() && job.status == 'success'
        run: |
          if [ -s /tmp/failure-notify.json ]; then
            echo "job succeeded but failures/warnings were recorded during the run:"
            python3 -c 'import json;d=json.load(open("/tmp/failure-notify.json"));[print(" -", e.get("type"), "/", e.get("stage"), ":", e.get("error")) for e in d.get("events",[])]' 2>/dev/null || cat /tmp/failure-notify.json
            ERR="$(python3 -c 'import json;d=json.load(open("/tmp/failure-notify.json"));print(d["events"][-1].get("error",""))' 2>/dev/null || true)"
            bash .github/scripts/notify.sh --type workflow --stage deferred-warning --error "${ERR:-see marker}" || true
          else
            echo "server run completed successfully"
          fi
          exit 0
