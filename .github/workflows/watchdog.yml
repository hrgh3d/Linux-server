name: watchdog

# نگهبان «همیشه فعال»: هر ۱۰ دقیقه چک می‌کند اگر هیچ رانی از main.yml زنده/در صف
# نباشد، خودش یکی روشن می‌کند. اگر رانی زنده باشد هیچ کاری نمی‌کند و هیچ‌وقت ران زنده
# را کنسل نمی‌کند (پس هندآف جانشین دست‌نخورده می‌ماند).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  ensure-running:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "watchdog: dispatch main.yml only when nothing is live"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SUCCESSOR_TOKEN || secrets.PERSIST_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "[watchdog] ERROR: no token (SUCCESSOR_TOKEN/PERSIST_TOKEN empty)"; exit 1; fi
          api() { curl -sS -m 30 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }

          # همهٔ وضعیت‌های «زنده» (in_progress/queued/waiting/requested/pending) در یک درخواست
          live=$(api "https://api.github.com/repos/${REPO}/actions/runs?per_page=50" | jq -r '
            [.workflow_runs[]
             | select(.path==".github/workflows/main.yml")
             | select(.status=="in_progress" or .status=="queued" or .status=="waiting"
                      or .status=="requested" or .status=="pending")] | length')

          # تازگی آخرین آپلود state هم به‌عنوان نشانهٔ سلامت ثبت می‌شود (فقط گزارش، نه تصمیم)
          last=$(api "https://api.github.com/repos/${REPO}/releases/tags/state" \
                 | jq -r '.assets[0].updated_at // "unknown"' 2>/dev/null || echo unknown)
          echo "[watchdog] $(date -u +%FT%TZ) main.yml live/queued=${live} last_state_upload=${last}"

          if [ "$live" -gt 0 ]; then
            echo "[watchdog] a main.yml run is live — nothing to do"
            exit 0
          fi
          code=$(api -X POST -o /tmp/resp.json -w '%{http_code}' -d '{"ref":"main"}' \
                 "https://api.github.com/repos/${REPO}/actions/workflows/main.yml/dispatches")
          echo "[watchdog] nothing live → dispatched main.yml (http=${code})"
          [ "$code" = "204" ] || { echo "[watchdog] ERROR dispatch failed"; head -c 300 /tmp/resp.json; exit 1; }
