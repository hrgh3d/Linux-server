name: watchdog

# نگهبان «همیشه فعال» — زمان‌بند A (هر ۱۰ دقیقه).
# منطق در .github/scripts/watchdog.sh است؛ watchdog-b.yml همان را با زمان‌بند دیگری
# اجرا می‌کند تا تأخیرهای زمان‌بندی گیت‌هاب جبران شود. (هر دو در یک concurrency group)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'یک هشدار تستی تلگرام بفرست (بررسی کانال هشدار)'
        required: false
        default: 'false'
      test_dispatch:
        description: 'تست دیسپچ با GITHUB_TOKEN روی ورک‌فلوی سبک'
        required: false
        default: 'false'

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog-keepalive
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  STATE_REPO: ${{ github.repository }}-state
  STATE_TAG: state
  STALE_MIN: '45'
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
  NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID || '7262486406' }}
  SUCCESSOR_TOKEN: ${{ secrets.SUCCESSOR_TOKEN || secrets.PERSIST_TOKEN || '' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TEST_ALERT: ${{ inputs.test_alert || 'false' }}
  TEST_DISPATCH: ${{ inputs.test_dispatch || 'false' }}

jobs:
  ensure-running:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "watchdog: keep a main.yml run alive + alert on stale state"
        shell: bash
        run: bash .github/scripts/watchdog.sh
