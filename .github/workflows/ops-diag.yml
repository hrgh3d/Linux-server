name: ops-diag (temporary)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAILSCALE_API_TOKEN: ${{ secrets.TAILSCALE_API_TOKEN }}
    steps:
      - name: diag
        shell: bash
        run: |
          set -uo pipefail
          curl -s -m 30 -H "Authorization: Bearer ${TAILSCALE_API_TOKEN:-none}" "https://api.tailscale.com/api/v2/tailnet/-/devices" -o /tmp/ts.json
          echo "=== devices whose .name matches linux/vps/hamid/gha ==="
          jq -r '.devices[] | select(.name|test("linux|vps|hamid|gha";"i")) | "\(.name) | host=\(.hostname) | online=\(.online) | lastSeen=\(.lastSeen) | \(.addresses|join(", "))"' /tmp/ts.json
          echo "=== count devices with name containing linux-server ==="
          jq -r '[.devices[] | select(.name|test("linux-server";"i"))] | length' /tmp/ts.json
          echo "=== last 5 devices by name (lexical tail) ==="
          jq -r '.devices[].name' /tmp/ts.json | sort | tail -5
          echo "=== which device had the most recent lastSeen (top 5) ==="
          jq -r '.devices[] | "\(.lastSeen) \(.name)"' /tmp/ts.json | sort -r | head -5
