<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>AI Hub</title>
<style>
:root{
  --bg:#0a0c10; --panel:#0f1218; --panel2:#141821; --raised:#1a1f2b;
  --line:#222835; --line2:#2d3546;
  --txt:#e8ecf4; --dim:#8b95a8; --faint:#5b6577;
  --accent:#e07a4a; --accent2:#f0a077;
  --blue:#4a8fe0; --ok:#3ecf8e; --warn:#e0b34a; --bad:#e05a5a; --purple:#9b7ae0;
  --sb:280px; --ctx:300px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column}
.rtl{unicode-bidi:plaintext;text-align:start}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:0;border:0;outline:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.top{height:calc(46px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);flex:none;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.brand .lg{width:22px;height:22px;border-radius:6px;flex:none;
  background:linear-gradient(135deg,var(--accent),#c4563a);
  display:grid;place-items:center;font-size:12px}
.mbtn{display:none;width:32px;height:32px;border-radius:8px;place-items:center;
  font-size:17px;color:var(--dim)}
.mbtn:hover{background:var(--raised)}
.omni{flex:1;max-width:460px;height:30px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;
  color:var(--faint);font-size:12.5px;cursor:pointer}
.omni:hover{border-color:var(--line2)}
.omni kbd{margin-left:auto;font:11px ui-monospace,monospace;background:var(--raised);
  border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--dim)}
.tstats{margin-left:auto;display:flex;align-items:center;gap:6px}
.tchip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  white-space:nowrap}
.tchip b{color:var(--txt);font-weight:600}
.iconb{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  color:var(--dim);font-size:15px;flex:none}
.iconb:hover{background:var(--raised);color:var(--txt)}
.iconb.on{background:var(--raised);color:var(--accent)}

.shell{flex:1;display:flex;min-height:0;position:relative}
.sb{width:var(--sb);flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:30}
.sbhead{padding:9px 10px 7px;display:flex;gap:6px;align-items:center}
.tabs{flex:1;display:flex;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:2px;gap:2px}
.tabs button{flex:1;height:25px;border-radius:6px;font-size:11.5px;color:var(--faint);
  font-weight:600}
.tabs button.on{background:var(--raised);color:var(--txt)}
.filt{padding:0 10px 8px}
.filt input{width:100%;height:29px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line);padding:0 9px;font-size:12.5px}
.filt input:focus{border-color:var(--line2)}
.sblist{flex:1;overflow-y:auto;padding:0 6px 10px}

.grp{margin-bottom:3px}
.grph{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;
  cursor:pointer;user-select:none}
.grph:hover{background:var(--panel2)}
.grph .tw{font-size:9px;color:var(--faint);width:9px;transition:transform .15s}
.grph.closed .tw{transform:rotate(-90deg)}
.grph .ic{font-size:14px;width:17px;text-align:center}
.grph .nm{font-weight:600;font-size:12.5px;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.up{background:var(--ok);box-shadow:0 0 6px #3ecf8e77}
.dot.down{background:var(--bad)}
.dot.busy{background:var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.grph .ct{font-size:10.5px;color:var(--faint);background:var(--panel2);
  border-radius:20px;padding:1px 6px;min-width:18px;text-align:center}
.grph .plus{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;
  font-size:13px;color:var(--faint);flex:none}
.grph .plus:hover{background:var(--raised);color:var(--accent)}
.grpb{overflow:hidden}
.grph.closed+.grpb{display:none}

.si{display:flex;gap:8px;align-items:flex-start;padding:6px 8px 6px 24px;border-radius:7px;
  cursor:pointer;position:relative}
.si:hover{background:var(--panel2)}
.si.sel{background:var(--raised)}
.si.sel::before{content:'';position:absolute;left:10px;top:9px;bottom:9px;width:2px;
  border-radius:2px;background:var(--accent)}
.si .sb2{flex:1;min-width:0}
.si .t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.si .p{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;margin-top:1px}
.si .tm{font-size:10px;color:var(--faint);flex:none;padding-top:2px}
.si .more{opacity:0;width:18px;height:18px;border-radius:4px;display:grid;
  place-items:center;font-size:13px;color:var(--faint);flex:none}
.si:hover .more{opacity:1}
.si .more:hover{background:var(--line2);color:var(--txt)}
.livedot{width:5px;height:5px;border-radius:50%;background:var(--warn);flex:none;
  animation:pulse 1.4s infinite}
.needdot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none}
.tg{font-size:9px;padding:0 4px;border-radius:3px;background:var(--line2);
  color:var(--dim)}

.sbfoot{flex:none;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.spend{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
.bar{flex:1;height:4px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--warn))}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.mhead{height:46px;flex:none;display:flex;align-items:center;gap:9px;padding:0 14px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.mhead .ic{font-size:15px;flex:none}
.mhead .ti{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.pill{display:flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--dim);
  white-space:nowrap;flex:none}
.pill.click{cursor:pointer}
.pill.click:hover{border-color:var(--line2);color:var(--txt)}
.pill.model{color:var(--purple);border-color:#3a2d5c}
.pill.live{color:var(--warn);border-color:#4a3d1a}
.pill .real{color:var(--faint);font-size:10.5px}
.mhead .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}

.msgs{flex:1;overflow-y:auto;padding:20px 0 8px}
.wrap{max-width:780px;margin:0 auto;padding:0 22px}
.m{display:flex;gap:11px;margin-bottom:20px}
.av{width:25px;height:25px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:1px}
.av.u{background:var(--raised);color:var(--dim);border:1px solid var(--line2)}
.av.a{background:linear-gradient(135deg,var(--accent),#c4563a);color:#fff}
.mb{flex:1;min-width:0}
.mn{font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:4px;
  display:flex;align-items:center;gap:7px}
.mn .tm{font-weight:400;color:var(--faint);font-size:10.5px}
.mn .macts{margin-left:auto;display:flex;gap:2px}
.mn .pinb{opacity:0;font-size:12px;color:var(--faint);min-width:28px;height:26px;
  border-radius:5px;transition:opacity .12s}
.m:hover .pinb{opacity:1}
.mn .pinb:hover{color:var(--accent);background:var(--raised)}
.mn .pinb:active{background:var(--line2)}
.mn .pinb.done{opacity:1;color:var(--ok)}
.mt{font-size:14px;line-height:1.72;white-space:pre-wrap;word-break:break-word}
.mt code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font:12.5px ui-monospace,monospace;color:var(--accent2)}
.tool{border:1px solid var(--line);border-radius:9px;background:var(--panel);
  margin:9px 0;overflow:hidden}
.toolh{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12px;
  background:var(--panel2);cursor:pointer}
.toolh .nm{font-weight:600;font-family:ui-monospace,monospace;font-size:11.5px}
.toolb{padding:10px 11px;font:11.5px/1.65 ui-monospace,monospace;color:var(--dim);
  border-top:1px solid var(--line);white-space:pre-wrap;max-height:180px;overflow:auto}
.typing{display:flex;gap:4px;padding:5px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--faint);
  animation:bob 1.3s infinite}
.typing i:nth-child(2){animation-delay:.16s}
.typing i:nth-child(3){animation-delay:.32s}
@keyframes bob{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.comp{flex:none;padding:10px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--panel)}
.cwrap{max-width:780px;margin:0 auto;position:relative}
.cbox{border:1px solid var(--line2);border-radius:12px;background:var(--panel2)}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{width:100%;padding:11px 13px 5px;font-size:14px;line-height:1.6;resize:none;
  max-height:170px;min-height:44px;display:block}
.crow{display:flex;align-items:center;gap:6px;padding:5px 8px 7px 11px}
.ctool{height:26px;padding:0 8px;border-radius:6px;font-size:11.5px;color:var(--faint);
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.ctool:hover{background:var(--raised);color:var(--txt)}
.send{margin-left:auto;width:29px;height:29px;border-radius:8px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.send:hover{background:var(--accent2)}
.send[disabled]{opacity:.4}
.chint{text-align:center;font-size:10.5px;color:var(--faint);margin-top:7px}
.slash{position:absolute;bottom:calc(100% + 7px);left:0;right:0;background:var(--raised);
  border:1px solid var(--line2);border-radius:11px;overflow:hidden;display:none;
  box-shadow:0 14px 40px rgba(0,0,0,.6);max-height:270px;overflow-y:auto;z-index:20}
.slash.on{display:block}
.slash .sh{padding:7px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--faint);border-bottom:1px solid var(--line)}
.sr{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer}
.sr:hover,.sr.hl{background:var(--panel2)}
.sr .cmd{font:12.5px ui-monospace,monospace;color:var(--accent2);font-weight:600;
  min-width:92px}
.sr .ds{font-size:12px;color:var(--dim);flex:1}
.sr .kb{font:10px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line2);
  border-radius:4px;padding:1px 5px}

.page{flex:1;overflow-y:auto;padding:22px}
.pwrap{max-width:980px;margin:0 auto}
.fh{font-size:19px;font-weight:650;letter-spacing:-.3px;margin-bottom:3px}
.fsub{font-size:13px;color:var(--dim);margin-bottom:18px}
.sech{font-size:13.5px;font-weight:650;margin:22px 0 9px;display:flex;
  align-items:center;gap:8px}
.sech .add{margin-left:auto;font-size:11.5px;color:var(--faint)}
.sech .add:hover{color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:11px}
.fc{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px;
  cursor:pointer}
.fc:hover{border-color:var(--line2)}
.fct{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.fct .ic{width:31px;height:31px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.fct .nb{flex:1;min-width:0}
.fct .nm{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.fct .vr{font-size:10.5px;color:var(--faint)}
.fmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
.tag.m{color:var(--purple);border-color:#3a2d5c}
.tag.s{color:var(--blue);border-color:#1f3a5c}
.tag.w{color:var(--warn);border-color:#4a3d1a}
.tag.b{color:var(--bad);border-color:#5c2020}
.tag.g{color:var(--ok);border-color:#1a4a35}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.sm{height:27px;padding:0 11px;border-radius:7px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sm.pri{background:var(--accent);color:#fff}
.sm.pri:hover{background:var(--accent2)}
.sm.gh{background:var(--raised);border:1px solid var(--line2);color:var(--dim)}
.sm.gh:hover{color:var(--txt)}
.sm.dg{background:#4a1f1f;border:1px solid #6b2d2d;color:#f0a0a0}
.srow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:6px;cursor:pointer}
.srow:hover{border-color:var(--line2)}
.srow .tx{flex:1;min-width:0}
.srow .t1{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.srow .t2{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.empty{text-align:center;color:var(--faint);padding:32px 14px;font-size:13px}

.ctx{width:var(--ctx);flex:none;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;z-index:30}
.ctx.off{display:none}
.cs{padding:13px;border-bottom:1px solid var(--line)}
.csh{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);
  margin-bottom:9px;font-weight:600;display:flex;align-items:center;gap:6px}
.csh .a{margin-left:auto;color:var(--faint);font-size:12px}
.csh .a:hover{color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:9px;font-size:12px;padding:3.5px 0}
.kv .k{color:var(--faint);flex:none}
.kv .v{font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;
  text-align:center}
.mc .v{font-size:15px;font-weight:650}
.mc .l{font-size:9.5px;color:var(--faint);text-transform:uppercase;margin-top:2px}
.qa{display:flex;flex-direction:column;gap:5px}
.qb{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--dim);
  text-align:left;width:100%}
.qb:hover{border-color:var(--line2);color:var(--txt)}
.qb .g{font-size:12px;width:15px;flex:none}
.ev{display:flex;gap:8px;font-size:11.5px;padding:5px 0;align-items:flex-start}
.ev .d{width:5px;height:5px;border-radius:50%;margin-top:6px;flex:none}
.ev .x{flex:1;min-width:0;color:var(--dim);line-height:1.5}
.ev .x b{color:var(--txt);font-weight:600}
.ev .t{font-size:10px;color:var(--faint);flex:none}
.spark{display:flex;align-items:flex-end;gap:3px;height:38px;margin-top:8px}
.spark i{flex:1;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,var(--accent),#7a3a22);min-height:3px;opacity:.85}
.memi{display:flex;gap:7px;font-size:11.5px;padding:5px 0;align-items:flex-start;
  border-bottom:1px solid var(--line)}
.memi:last-child{border:0}
.memi .x{flex:1;color:var(--dim);line-height:1.5}
.memi .d{opacity:0;color:var(--faint);font-size:12px}
.memi:hover .d{opacity:1}

.learned{margin-top:9px;padding:7px 10px;border-radius:7px;font-size:11.5px;
  background:rgba(224,122,74,.09);border:1px solid rgba(224,122,74,.28);
  color:var(--dim);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.learned span{background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:2px 8px;unicode-bidi:plaintext}

.cb{position:relative;margin:8px 0}
.cb pre{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:11px 13px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,monospace;
  color:var(--dim);direction:ltr;text-align:left}
.cbc{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:5px;
  background:var(--panel);border:1px solid var(--line);color:var(--faint);
  font-size:12px;opacity:0;transition:opacity .12s}
.cb:hover .cbc{opacity:1}
.cbc:hover{color:var(--accent);border-color:var(--line2)}
.cbc.done{opacity:1;color:var(--ok)}
@media(hover:none){.cbc{opacity:1;width:32px;height:32px}}

/* ─── دستگاه لمسی ───────────────────────────────────────────────
   روی موبایل موس نیست، پس هر کنترلی که با :hover ظاهر می‌شد
   هرگز قابل دسترس نبود. اینجا همه را دائمی می‌کنیم و هدف لمس را
   به حداقل ۴۴ پیکسل (توصیهٔ اپل) می‌رسانیم. */
@media(hover:none){
  .si .more,.mn .pinb,.memi .d{opacity:1 !important}
  .si .more{width:30px;height:30px;font-size:15px;background:var(--panel2)}
  .mn .pinb{min-width:34px;height:32px;font-size:14px;background:var(--panel2)}
  .memi .d{min-width:34px;height:32px}
  .grph .plus{width:30px;height:30px;font-size:17px}
  .iconb,.ctool{min-width:38px;min-height:38px}
  .sm{min-height:40px;padding:0 14px}
  .menu button{min-height:44px;font-size:14px}
  .qb{min-height:38px}
  .pill{min-height:30px}
  /* hover روی لمسی «می‌چسبد» و رنگ را گیر می‌اندازد */
  .si:hover,.pi:hover,.mrow:hover,.sr:hover{background:transparent}
  .si:active,.pi:active,.mrow:active,.sr:active{background:var(--panel2)}
}

.mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);display:none;
  align-items:flex-start;justify-content:center;padding-top:9vh;backdrop-filter:blur(3px);
  overflow-y:auto}
.mask.on{display:flex}
.pal{width:min(600px,92vw);background:var(--raised);border:1px solid var(--line2);
  border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.66)}
.pali{display:flex;align-items:center;gap:10px;padding:13px 15px;
  border-bottom:1px solid var(--line)}
.pali input{flex:1;font-size:15px}
.palr{max-height:52vh;overflow-y:auto;padding:5px}
.pg{padding:7px 11px 4px;font-size:9.5px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--faint);font-weight:600}
.pi{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;
  cursor:pointer}
.pi:hover,.pi.hl{background:var(--panel2)}
.pi .g{width:19px;text-align:center;font-size:14px;flex:none}
.pi .tt{flex:1;min-width:0;font-size:13px}

.mlist{max-height:300px;overflow-y:auto;margin:-4px -4px 12px}

  font:11.5px/1.6 ui-monospace,monospace;max-height:280px;overflow:auto;
  white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext;margin-top:10px}
.ctxpre{background:#080b10;border:1px solid var(--line);border-radius:9px;padding:11px;
  font:11px/1.55 ui-monospace,monospace;max-height:240px;overflow:auto;
  white-space:pre-wrap;color:var(--dim);unicode-bidi:plaintext}

.menu{position:fixed;z-index:150;background:var(--raised);border:1px solid var(--line2);
  border-radius:10px;padding:4px;min-width:190px;box-shadow:0 14px 40px rgba(0,0,0,.6);
  display:none}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;
  border-radius:7px;font-size:12.5px;color:var(--dim);text-align:left}
.menu button:hover{background:var(--panel2);color:var(--txt)}
.menu button.dg:hover{background:#3a1818;color:#f0a0a0}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--raised);border:1px solid var(--line2);border-radius:10px;
  padding:10px 16px;font-size:13px;z-index:200;opacity:0;transition:all .22s;
  pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:#6b2d2d}
.toast.ok{border-color:#1a4a35}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #fff5;
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none}

@media(max-width:1180px){ .ctx{display:none} .ctx.force{display:block} }
@media(max-width:860px){
  .mbtn{display:grid}
  .sb{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);
    transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.6);width:290px}

  .ctx.force{transform:none}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:25}
  .scrim.on{display:block}
  .hide-sm{display:none!important}
  .omni span{display:none}
  .wrap,.cwrap{padding:0 14px}
  .comp{padding:9px 10px 12px}
  .page{padding:14px}
  .fgrid{grid-template-columns:1fr}
  .si .more{opacity:1}
}
</style>
</head>
<body>

<div class="top">
  <button class="mbtn" id="mbSb">☰</button>
  <div class="brand"><div class="lg">◆</div><span class="hide-sm">AI Hub</span></div>
  <div class="omni" id="omni"><span style="font-size:12px">⌕</span>
    <span>Search sessions, run commands, switch models…</span><kbd>⌘K</kbd></div>
  <div class="tstats">
    <div class="tchip hide-sm" id="tUp">—</div>
    <div class="tchip hide-sm" id="tTok">—</div>

  </div>
</div>

<div class="shell">
  <div class="scrim" id="scrim"></div>
  <aside class="sb" id="sb">
    <div class="sbhead">
      <div class="tabs">
        <button class="on" data-t="sessions" title="All chats not in a project">General</button>
        <button data-t="projects" title="Shared projects with auto memory">Projects</button>
      </div>
      <button class="iconb" id="btnHome" title="Home">⌂</button>
    </div>
    <div class="filt"><input id="filt" placeholder="Filter…"></div>
    <div class="sblist" id="tree"></div>
    <div class="sbfoot"><div class="spend">
      <span>Today</span><div class="bar"><i id="spendBar" style="width:0%"></i></div>

  <main class="main">
    <div class="mhead" id="mhead"></div>

    <div class="comp" id="comp" style="display:none"><div class="cwrap">
      <div class="slash" id="slash"></div>
      <div class="cbox">
        <textarea id="ta" class="rtl" rows="1"
          placeholder="Message the agent…  press / for commands"></textarea>
        <div class="crow">
          <button class="ctool" id="cmdBtn">/ commands</button>
          <button class="ctool hide-sm" id="skillBtn">⚡ skills</button>
          <button class="ctool" id="modelBtn2">◆ <span id="mLbl">—</span></button>
          <button class="send" id="send">➤</button>
        </div>
      </div>
      <div class="chint">⏎ send · ⇧⏎ newline · ⌘K palette</div>
    </div></div>
  </main>

  <aside class="ctx" id="ctx"></aside>
</div>

<div class="mask" id="mask"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
// دکمه‌های کپیِ بلوک کد را در هر جایی که پیام رندر شده وصل می‌کند.
function bindCodeCopy(root){
  const sc=(root||document).querySelectorAll('.cbc:not([data-b])');
  sc.forEach(b=>{b.setAttribute('data-b','1');
    b.onclick=()=>copyText(decodeURIComponent(b.dataset.c||''),b);});
}

// کپی متن. navigator.clipboard فقط در context امن (https یا localhost)
// کار می‌کند و پنل روی http هم باز می‌شود، پس fallback لازم است.
async function copyText(t,btn){
  const s=String(t??'');
  let ok=false;
  try{ if(navigator.clipboard&&window.isSecureContext){
    await navigator.clipboard.writeText(s); ok=true; } }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');
    ta.value=s; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0,s.length);
    try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    ta.remove();
  }
  if(btn){
    const o=btn.textContent;
    btn.textContent=ok?'✓':'✕'; btn.classList.toggle('done',ok);
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('done');},1100);
  }
  toast(ok?'Copied':'Could not copy');
  return ok;
}

// نشانگر قطعیت انتساب مدل: '' یعنی قطعی، '~' یعنی این مدل در چند
// کامبو هست و نمی‌توان مطمئن بود. هرگز حدس را قطعی نشان نده.
const mark=e=>e===true?'':'~';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// بلوک کد دکمهٔ کپی مستقل می‌گیرد؛ محتوا در data-c به صورت encode شده
// می‌نشیند تا نقل‌قول و < > آن، خودِ صفت را نشکند.
const md=s=>{
  let t=esc(s);
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>
    `<div class="cb"><button class="cbc" data-c="${encodeURIComponent(c)}"`+
    ` title="Copy code">⧉</button><pre>${c.replace(/^\n/,'')}</pre></div>`);
  return t.replace(/`([^`]+)`/g,'<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
};
const num=n=>(n??0).toLocaleString('en-US');
const ICON={hermes:'🤖',claude:'💻',pi:'🥧',openclaw:'🐾',router:'🔀'};

let S={apps:[],sessions:[],projects:[],live:{combos:{},agents:{}},usage:{},
       combos:[],timeline:[],health:{},perms:{},skills:[]};
let view={kind:'home'}, closed={}, filt='', tab='sessions', busy=false;

function toast(m,k=''){const t=$('#toast');t.textContent=m;t.className='toast on '+k;
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600);}
function ago(x){if(!x)return'';const d=(Date.now()-new Date(x).getTime())/1000;
  if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';
  if(d<86400)return Math.floor(d/3600)+'h';return Math.floor(d/86400)+'d';}
function agoS(s){if(s==null)return'';if(s<60)return s+'s';if(s<3600)return Math.floor(s/60)+'m';
  return Math.floor(s/3600)+'h';}

async function api(p,o){const r=await fetch(p,o);
  if(!r.ok){let t=await r.text().catch(()=>'');throw new Error(t.slice(0,200)||r.status);}
  return r.json();}
async function post(p,b){return api(p,{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})});}
async function patch(p,b){return api(p,{method:'PATCH',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(b||{})});}
async function del(p){return api(p,{method:'DELETE'});}

const app=k=>S.apps.find(a=>a.key===k)||{key:k,name:k,icon:ICON[k]||'●',capabilities:[]};

/* ═══════════ modal / menu ═══════════ */
function mask(h){$('#mask').innerHTML=h;$('#mask').classList.add('on');}
function close_(){$('#mask').classList.remove('on');}
window.close_=close_;
$('#mask').onclick=e=>{if(e.target.id==='mask')close_();};
function menu(x,y,items){
  const m=$('#menu');
  m.innerHTML=items.map(i=>i==='-'?'<hr>':
    `<button class="${i.dg?'dg':''}" data-i="${i.id}">${i.icon||''} ${esc(i.label)}</button>`).join('');
  m.style.left=Math.min(x,innerWidth-205)+'px';
  m.style.top=Math.min(y,innerHeight-items.length*32-10)+'px';
  m.classList.add('on');
  m.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.classList.remove('on');
    const it=items.find(i=>i!=='-'&&i.id===b.dataset.i); it&&it.fn&&it.fn();});
}
addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('on');});

function confirmDlg(t,b,okLabel,fn){
  mask(`<div class="dlg"><h3>⚠ ${esc(t)}</h3><p>${esc(b)}</p><div class="dlgf">
    <button class="sm gh" onclick="close_()">Cancel</button>
    <button class="sm dg" id="yes">${esc(okLabel)}</button></div></div>`);
  $('#yes').onclick=()=>{close_();fn();};
}
window.confirmDlg=confirmDlg;

// کل گفت‌وگو را به صورت markdown کپی می‌کند — برای پیست در جای دیگر
async function copySession(a,id){
  try{
    const d=await api(`/api/session/${a}/${encodeURIComponent(id)}`);
    const t=(d.messages||[]).map(m=>
      `**${m.role==='user'?'You':app(a).name}**${m.ts?' · '+m.ts:''}\n${m.text}`)
      .join('\n\n---\n\n');
    await copyText(t||'(empty)');
  }catch(e){toast('Failed: '+e.message,'bad');}
}

// نشست را عضو پروژه می‌کند؛ از این به بعد حافظه خودکار کار می‌کند
async function bindSession(a,id,pid){
  try{
    await post(`/api/session/${a}/${encodeURIComponent(id)}/bind`,{project_id:pid});
    toast(pid?'Moved into project — memory is automatic now':'Removed from project','ok');
    await refresh();
    if(view.sid===id)openSession(a,id);
  }catch(e){toast('Failed: '+e.message,'bad');}
}

function moveToProject(a,id,s){
  if(!S.projects.length){toast('Create a project first');projDlg();return;}
  mask(`<div class="dlg"><h3>📁 Move chat into a project</h3>
    <p class="hint">Everything in a project shares one memory. Findings from this
      chat are added automatically — you never pin anything by hand.</p>
    <div class="flist">${S.projects.map(p=>`
      <label class="fc"><input type="radio" name="pp" value="${p.id}"
        ${s.project_id===p.id?'checked':''}>
        <span>${p.icon||'📁'} ${esc(p.name)}</span>
        <span class="hint" style="margin:0">${esc(p.goal||'')}</span></label>`).join('')}</div>
    <div class="dlgf"><button class="sm gh" onclick="close_()">Cancel</button>
      <button class="sm pri" id="mvGo">Move</button></div></div>`);
  $('#mvGo').onclick=()=>{
    const r=document.querySelector('input[name=pp]:checked');
    if(!r){toast('Pick one');return;}
    close_();bindSession(a,id,r.value);};
}

// از داخل خود پروژه: کدام گفت‌وگو را بیاورم اینجا؟
function addChatDlg(pid){
  const free=S.sessions.filter(s=>!s.project_id);
  mask(`<div class="dlg wide"><h3>＋ Add a chat to this project</h3>
    ${free.length?`<p class="hint">Pick an existing chat, or start a fresh one
      with any agent. Once inside, its findings feed the shared memory by itself.</p>
    <div class="flist" style="max-height:44vh;overflow:auto">${free.map(s=>`
      <label class="fc"><input type="radio" name="ac" value="${esc(s.id)}|${s.source}">
        <span>${ICON[s.source]||'•'} ${esc(s.title||s.id)}</span>
        <span class="hint" style="margin:0">${esc((s.preview||'').slice(0,70))}</span>
      </label>`).join('')}</div>`:
      '<p class="hint">No free chats. Start a new one below.</p>'}
    <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap">
      ${S.apps.filter(a=>a.key!=='router'&&a.capabilities.includes('send')).map(a=>
        `<button class="qb" data-na="${a.key}">${a.icon} New ${esc(a.name)} chat</button>`).join('')}
    </div>
    <div class="dlgf"><button class="sm gh" onclick="close_()">Cancel</button>
      ${free.length?'<button class="sm pri" id="acGo">Add</button>':''}</div></div>`);
  const go=$('#acGo');
  if(go)go.onclick=()=>{
    const r=document.querySelector('input[name=ac]:checked');
    if(!r){toast('Pick one');return;}
    const [id,a]=r.value.split('|');close_();bindSession(a,id,pid);};
  $$('[data-na]').forEach(b=>b.onclick=async()=>{
    close_();await newSession(b.dataset.na,pid);});
}

/* ═══════════ sidebar ═══════════ */
function tree(){
  if(tab==='projects')return treeProjects();
  const q=filt.toLowerCase();
  const html=S.apps.filter(a=>a.key!=='router').map(a=>{
    // نشست‌های عضو پروژه در تب Projects زیر خود پروژه دیده می‌شوند،
    // پس اینجا تکرارشان نمی‌کنیم — «کلی» یعنی هرچه در پروژه نیست.
    const ss=S.sessions.filter(s=>s.source===a.key&&!s.project_id&&
      (!q||((s.title||'')+(s.preview||'')+(s.tags||[]).join()).toLowerCase().includes(q)));
    if(q&&!ss.length)return'';
    const live=ss.some(s=>s.state==='working'||s.state==='needs_input');
    const lm=S.live.agents[a.key]||{};
    return `<div class="grp">
      <div class="grph ${closed[a.key]&&!q?'closed':''}" data-g="${a.key}"
           title="${esc(lm.real||a.model||'')}">
        <span class="tw">▼</span><span class="ic">${a.icon}</span>
        <span class="nm">${esc(a.name)}</span>
        <span class="dot ${!a.running?'down':(live?'busy':'up')}"></span>
        <span class="ct">${ss.length}</span>
        ${a.capabilities.includes('send')?
          `<span class="plus" data-new="${a.key}" title="New ${esc(a.name)} session">＋</span>`:''}
      </div>
      <div class="grpb">${ss.map(s=>`
        <div class="si ${view.sid===s.id?'sel':''}" data-s="${esc(s.id)}" data-a="${s.source}">
          <div class="sb2">
            <div class="t rtl">${s.pinned?'📌':''}${s.state==='working'?'<span class="livedot"></span>':
              s.state==='needs_input'?'<span class="needdot"></span>':''}${s.icon?s.icon+' ':''}${esc(s.title||s.id)}
              ${(s.tags||[]).map(t=>`<span class="tg">${esc(t)}</span>`).join('')}</div>
            <div class="p rtl">${esc(s.preview||'')}</div>
          </div>
          <div class="tm">${ago(s.last_active)}</div>
          <button class="more" data-menu="${esc(s.id)}|${s.source}">⋯</button>
        </div>`).join('')}</div></div>`;
  }).join('');
  $('#tree').innerHTML=html||'<div class="empty">No sessions</div>';
  $$('#tree .grph').forEach(g=>g.onclick=e=>{
    if(e.target.dataset.new){e.stopPropagation();newSession(e.target.dataset.new);return;}
    closed[g.dataset.g]=!closed[g.dataset.g];tree();});
  $$('#tree .si').forEach(el=>el.onclick=e=>{
    if(e.target.dataset.menu){e.stopPropagation();
      const [id,a]=e.target.dataset.menu.split('|');
      const r=e.target.getBoundingClientRect(); sessMenu(a,id,r.left-140,r.bottom+4);return;}
    openSession(el.dataset.a,el.dataset.s);drawers(false);});
}

function treeProjects(){
  const q=filt.toLowerCase();
  const ps=S.projects.filter(p=>!q||p.name.toLowerCase().includes(q));
  $('#tree').innerHTML=`
    <div class="grp"><div class="grph" id="newProj">
      <span class="tw"></span><span class="ic">＋</span>
      <span class="nm" style="color:var(--accent)">New project</span></div></div>`+
    (ps.map(p=>{
      const ms=S.sessions.filter(s=>s.project_id===p.id);
      const open=!closed['p:'+p.id];
      return `<div class="grp">
        <div class="grph ${open?'':'closed'}" data-pg="${p.id}"
             style="${view.pid===p.id?'background:var(--raised)':''}">
          <span class="tw">▼</span><span class="ic">${p.icon||'📁'}</span>
          <span class="nm rtl">${esc(p.name)}</span>
          <span class="dot ${p.status==='active'?'up':'down'}"></span>
          <span class="ct">${ms.length}</span>
          <span class="plus" data-open="${p.id}" title="Open workspace">⤢</span>
        </div>
        <div class="grpb">${ms.length?ms.map(s=>`
          <div class="si ${view.sid===s.id?'sel':''}" data-s="${esc(s.id)}" data-a="${s.source}">
            <div class="sb2">
              <div class="t rtl">${ICON[s.source]||'•'} ${esc(s.title||s.id)}</div>
              <div class="p rtl">${esc(s.preview||'')}</div>
            </div>
            <div class="tm">${ago(s.last_active)}</div>
            <button class="more" data-menu="${esc(s.id)}|${s.source}">⋯</button>
          </div>`).join(''):
          '<div class="empty" style="padding:9px 14px;font-size:11.5px">'+
          'No chats yet. Open the workspace, or use ⋯ → Move to project.</div>'}
          <div class="si" data-addp="${p.id}" style="color:var(--accent)">
            <div class="sb2"><div class="t">＋ Add a chat here</div></div></div>
        </div></div>`;}).join('')
      ||'<div class="empty">No projects yet</div>');
  const np=$('#newProj'); if(np)np.onclick=projDlg;
  $$('#tree [data-pg]').forEach(g=>g.onclick=e=>{
    if(e.target.dataset.open){e.stopPropagation();
      openProject(e.target.dataset.open);drawers(false);return;}
    closed['p:'+g.dataset.pg]=!closed['p:'+g.dataset.pg];tree();});
  $$('#tree [data-addp]').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();addChatDlg(e.dataset.addp);});
  $$('#tree .si[data-s]').forEach(el=>el.onclick=e=>{
    if(e.target.dataset.menu){e.stopPropagation();
      const [id,a]=e.target.dataset.menu.split('|');

  </div>`;
  $$('#stage .fc').forEach(c=>c.onclick=e=>{

/* ═══════════ session view ═══════════ */
async function openSession(a,id){
  view={kind:'session',app:a,sid:id}; tree(); drawers(false);
  const s=S.sessions.find(x=>x.id===id&&x.source===a)||{id,source:a,title:id};
  const A=app(a), lm=S.live.agents[a]||{};
  const P=s.project_id?S.projects.find(x=>x.id===s.project_id):null;
  $('#mhead').innerHTML=`<span class="ic">${s.icon||A.icon}</span>
    <span class="ti rtl">${esc(s.title||id)}</span>
    <span class="pill model click" id="mp">◆ ${esc(s.model||A.model||'model')}
      ${lm.real?`<span class="real">${mark(lm.exact)}${esc(lm.real)}</span>`:''}</span>
    ${s.state==='working'?'<span class="pill live hide-sm">● generating</span>':''}
    ${P?`<span class="pill click" data-projbadge="1" title="Shared project — memory is automatic"
      onclick="openProject('${P.id}')">📁 ${esc(P.name)} · 🧠 auto</span>`:''}
    <div class="sp">
      <span class="pill hide-sm">${s.msg_count==null?'—':s.msg_count+' msgs'}</span>
      <button class="iconb" id="hoBtn" title="Hand off">⇄</button>
      <button class="iconb" id="moreBtn" title="More">⋯</button>
    </div>`;
  $('#mp').onclick=()=>modelDlg(a);
  $('#hoBtn').onclick=()=>handoffDlg(a,id);
  $('#moreBtn').onclick=e=>{const r=e.target.getBoundingClientRect();
    sessMenu(a,id,r.left-160,r.bottom+6);};
  $('#comp').style.display='';
  $('#mLbl').textContent=s.model||A.model||'model';
  $('#stage').className='msgs';
  $('#stage').innerHTML='<div class="wrap"><div class="empty">Loading…</div></div>';
  try{
    const d=await api(`/api/session/${a}/${encodeURIComponent(id)}`);
    const ms=d.messages||[];
    $('#stage').innerHTML=`<div class="wrap">${ms.length?ms.map((m,i)=>`
      <div class="m"><div class="av ${m.role==='user'?'u':'a'}">${m.role==='user'?'H':A.icon}</div>
        <div class="mb"><div class="mn">${m.role==='user'?'You':esc(A.name)}
          <span class="tm">${m.ts?ago(m.ts):''}</span>
          <span class="macts">
            <button class="pinb" data-copy="${i}" title="Copy message">⧉</button>
            <button class="pinb" data-pin="${i}" title="Pin to project memory">📌</button>
          </span></div>
          <div class="mt rtl">${md(m.text)}</div></div></div>`).join(''):
      '<div class="empty">No readable messages yet.</div>'}</div>`;
    $$('#stage [data-pin]').forEach(b=>b.onclick=()=>pinToMemory(ms[+b.dataset.pin]));
    $$('#stage [data-copy]').forEach(b=>b.onclick=()=>copyText(ms[+b.dataset.copy].text,b));
    bindCodeCopy();
    $('#stage').scrollTop=9e5;
  }catch(e){$('#stage').innerHTML=`<div class="wrap"><div class="empty">${esc(e.message)}</div></div>`;}
  rail(s);
}

const ta=$('#ta');
function slashDraw(q){
  const l=CMDS.filter(c=>c.c.startsWith(q));
  if(!l.length)return $('#slash').classList.remove('on');
  $('#slash').innerHTML='<div class="sh">Commands</div>'+l.map((c,i)=>
    `<div class="sr ${i===0?'hl':''}" data-c="${c.c}"><span class="cmd">${c.c}</span>
      <span class="ds">${c.d}</span>${c.k?`<span class="kb">${c.k}</span>`:''}</div>`).join('');
  $('#slash').classList.add('on');
  $$('#slash .sr').forEach(r=>r.onclick=()=>{$('#slash').classList.remove('on');
    ta.value='';(CMDS.find(c=>c.c===r.dataset.c)||{}).fn?.();});
}
ta.addEventListener('input',()=>{ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,170)+'px';
  const v=ta.value;
  if(v.startsWith('/')&&!v.includes(' '))slashDraw(v);else $('#slash').classList.remove('on');});
ta.addEventListener('keydown',e=>{
  if(e.key==='Escape')$('#slash').classList.remove('on');
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
    const hl=$('#slash.on .sr.hl');
    if(hl){$('#slash').classList.remove('on');ta.value='';
      (CMDS.find(c=>c.c===hl.dataset.c)||{}).fn?.();return;}
    send();}});
$('#send').onclick=send;
$('#cmdBtn').onclick=()=>{ta.value='/';ta.focus();slashDraw('/');};
$('#skillBtn').onclick=skillsDlg;
$('#modelBtn2').onclick=()=>modelDlg(view.app||'claude');

async function send(){
  const t=ta.value.trim(); if(!t||busy)return;
  const a=view.app||'claude';
  busy=true;$('#send').disabled=true;$('#send').innerHTML='<span class="spin"></span>';
  const w=$('#stage .wrap');
  if(w){w.insertAdjacentHTML('beforeend',`<div class="m">
    <div class="av u">H</div><div class="mb"><div class="mn">You</div>
    <div class="mt rtl">${md(t)}</div></div></div>
    <div class="m" id="pend"><div class="av a">${app(a).icon}</div>
    <div class="mb"><div class="mn">${esc(app(a).name)}</div>
    <div class="typing"><i></i><i></i><i></i></div></div></div>`);
    $('#stage').scrollTop=9e5;}
  ta.value='';ta.style.height='auto';
  try{
    const r=await post('/api/send',{app:a,text:t,session_id:view.sid});
    const p=$('#pend');
    // آنچه خودکار وارد حافظهٔ تیم شد، شفاف نشان داده می‌شود تا کاربر
    // بداند دقیقاً چه چیزی ذخیره شد — حافظهٔ نامرئی قابل اعتماد نیست.
    const learned=(r.learned||[]).length?`<div class="learned">🧠 added to shared memory:
      ${r.learned.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'';
    if(p)p.outerHTML=`<div class="m"><div class="av a">${app(a).icon}</div>
      <div class="mb"><div class="mn">${esc(app(a).name)}
        <span class="macts"><button class="pinb" id="lastCopy" title="Copy">⧉</button></span></div>
      <div class="mt rtl">${md(r.output||'(empty)')}</div>${learned}</div></div>`;
    const lc=$('#lastCopy'); if(lc)lc.onclick=()=>copyText(r.output||'',lc);
    bindCodeCopy();
    $('#stage').scrollTop=9e5;
    // نشست تازه‌ای که قرار بود عضو پروژه شود، حالا که ساخته شده وصلش کن
    if(view.newIn){
      await refresh();
      const mine=S.sessions.filter(x=>x.source===a&&!x.project_id)
        .sort((x,y)=>new Date(y.last_active||0)-new Date(x.last_active||0))[0];
      if(mine){await post(`/api/session/${a}/${encodeURIComponent(mine.id)}/bind`,
        {project_id:view.newIn});
        view={kind:'session',app:a,sid:mine.id};}
      view.newIn=null;
    }
    refresh();
  }catch(e){
    const p=$('#pend');
    if(p)p.outerHTML=`<div class="m"><div class="av a">⚠</div><div class="mb">
      <div class="mn">Error</div><div class="mt">${esc(e.message)}</div></div></div>`;
    toast('Failed','bad');
  }
  busy=false;$('#send').disabled=false;$('#send').textContent='➤';
}

/* ═══════════ palette ═══════════ */
function pal(pre){
  mask(`<div class="pal"><div class="pali"><span style="color:var(--faint)">⌕</span>
    <input id="pq" placeholder="Search sessions, run a command…" autocomplete="off"></div>
    <div class="palr" id="pr"></div></div>`);
  let timer;
  const draw=async()=>{
    const q=($('#pq').value||'').trim().toLowerCase();
    const cs=CMDS.filter(c=>!q||(c.c+c.d).toLowerCase().includes(q));
    const ss=S.sessions.filter(s=>q&&((s.title||'')+(s.preview||'')).toLowerCase().includes(q));
    const as=S.apps.filter(a=>!q||a.name.toLowerCase().includes(q));
    const ps=S.projects.filter(p=>q&&p.name.toLowerCase().includes(q));
    let html=
      (cs.length?'<div class="pg">Commands</div>'+cs.map(c=>
        `<div class="pi" data-c="${c.c}"><span class="g">⌘</span>
        <div class="tt">${c.c}<small>${c.d}</small></div>
        ${c.k?`<span class="kb">${c.k}</span>`:''}</div>`).join(''):'')+
      (ps.length?'<div class="pg">Projects</div>'+ps.map(p=>
        `<div class="pi" data-p="${p.id}"><span class="g">${p.icon||'📁'}</span>
        <div class="tt rtl">${esc(p.name)}<small>${esc(p.goal||'')}</small></div></div>`).join(''):'')+
      (ss.length?'<div class="pg">Sessions</div>'+ss.map(s=>
        `<div class="pi" data-s="${esc(s.id)}" data-a="${s.source}">
        <span class="g">${s.icon||app(s.source).icon}</span>
        <div class="tt rtl">${esc(s.title)}<small>${esc(s.preview||'')}</small></div>
        <span class="kb">${ago(s.last_active)}</span></div>`).join(''):'')+
      (as.length&&q?'<div class="pg">Agents</div>'+as.map(a=>
        `<div class="pi" data-a2="${a.key}"><span class="g">${a.icon}</span>
        <div class="tt">${esc(a.name)}<small>${esc(a.model||'')} · ${esc(a.detail||'')}</small></div></div>`).join(''):'');
    $('#pr').innerHTML=html||'<div class="empty">Nothing</div>';
    bind();
    // جست‌وجوی سراسری در متن گفتگوها — با تأخیر تا هر کلید یک درخواست نزند
    if(q.length>2){clearTimeout(timer);timer=setTimeout(async()=>{
      try{const hits=await api('/api/search?q='+encodeURIComponent(q));
        if(!hits.length)return;
        $('#pr').insertAdjacentHTML('beforeend','<div class="pg">In conversations</div>'+
          hits.slice(0,8).map(h=>`<div class="pi" data-s="${esc(h.session)}" data-a="${h.app}">
            <span class="g">${ICON[h.app]||'●'}</span>
            <div class="tt rtl">${esc(h.snippet)}<small>${esc(h.app)} · ${esc(h.role)}</small></div>
            </div>`).join(''));
        bind();}catch(e){}},260);}
  };
  const bind=()=>$$('#pr .pi').forEach(p=>p.onclick=()=>{
    close_();
    if(p.dataset.s)openSession(p.dataset.a,p.dataset.s);
    else if(p.dataset.p)openProject(p.dataset.p);
    else if(p.dataset.a2)newSession(p.dataset.a2);
    else (CMDS.find(c=>c.c===p.dataset.c)||{}).fn?.();});
  $('#pq').oninput=draw;
  if(pre)$('#pq').value=pre;
  draw();setTimeout(()=>$('#pq').focus(),40);
}
window.pal=pal;

/* ═══════════ data ═══════════ */
function applyOverview(d){
  S.apps=d.apps||[];S.usage=d.usage||{};S.combos=d.combos||[];S.series=d.series||[];
  if(d.projects)S.projects=d.projects;
  if(d.timeline)S.timeline=d.timeline;
  if(d.perms)S.perms=d.perms;
  if(d.health)S.health=d.health;
  if(d.live)S.live=d.live;
  const up=S.apps.filter(a=>a.running).length;
  $('#tUp').innerHTML=`<span class="dot up"></span> <b>${up}</b>/${S.apps.length} up`;
  $('#tTok').innerHTML=`⚡ <b>${num((S.usage.prompt||0)+(S.usage.completion||0))}</b>`;
  $('#tCost').innerHTML=`$<b>${(S.usage.cost||0).toFixed(3)}</b>`;
  $('#spendTxt').textContent='$'+(S.usage.cost||0).toFixed(3);
  $('#spendBar').style.width=Math.min(100,(S.usage.cost||0)/0.01)+'%';
}
async function refresh(){
  try{
    const [ov,ss]=await Promise.all([api('/api/overview2'),api('/api/sessions')]);
    applyOverview(ov);S.sessions=ss;
    tree();
    if(view.kind==='home')home();
    else if(view.kind==='session'&&view.sid)rail(S.sessions.find(
      x=>x.id===view.sid&&x.source===view.app));
  }catch(e){console.warn(e);}
}
function stream(){
  try{const es=new EventSource('/api/stream');
    es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.error)return;
      applyOverview(d);if(view.kind==='home')home();else tree();}catch(_){}};
  }catch(_){setInterval(refresh,10000);}
}

/* ═══════════ wiring ═══════════ */
$('#omni').onclick=()=>pal();
$('#btnHome').onclick=home;
$('#filt').oninput=e=>{filt=e.target.value;tree();};
function drawers(open){
  if(open===false){$('#sb').classList.remove('open');$('#ctx').classList.remove('force');
    $('#scrim').classList.remove('on');}
}
$('#mbSb').onclick=()=>{const o=$('#sb').classList.toggle('open');
  $('#scrim').classList.toggle('on',o);$('#ctx').classList.remove('force');};
$('#mbCtx').onclick=()=>{if(innerWidth>1180){$('#ctx').classList.toggle('off');return;}
  const o=$('#ctx').classList.toggle('force');
  $('#scrim').classList.toggle('on',o);$('#sb').classList.remove('open');};
$('#scrim').onclick=()=>drawers(false);
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='k'){e.preventDefault();pal();}
  if((e.metaKey||e.ctrlKey)&&k==='n'){e.preventDefault();newSession(view.app||'claude');}
  if((e.metaKey||e.ctrlKey)&&k==='m'){e.preventDefault();modelDlg(view.app||'claude');}
  if((e.metaKey||e.ctrlKey)&&k==='f'){e.preventDefault();pal();}
  if(e.key==='Escape'){close_();$('#menu').classList.remove('on');}
});

refresh().then(()=>{home();stream();});
</script>
</body>
</html>
